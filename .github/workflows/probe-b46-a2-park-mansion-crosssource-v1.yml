name: V10 B46 A2 Park Mansion cross-source probe v1

on:
  pull_request:
    paths:
      - research/probe_b46_a2_park_mansion_crosssource_v1.py
      - research/probe_b46_sphere_plateau_v1.py
      - research/probe_b46_sphere_gsi_vector_v1.py
      - .github/workflows/probe-b46-a2-park-mansion-crosssource-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests lxml pyproj shapely mapbox-vector-tile
      - name: Probe A2 cross-source geometry
        run: python research/probe_b46_a2_park_mansion_crosssource_v1.py
      - name: Verify fail-closed contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('out-b46-a2-park-mansion-crosssource-v1/SUMMARY.json').read_text(encoding='utf-8'))
          assert s['formalBuildingPolygonsPromoted']==0,s
          assert s['policy']['nearestFallback'] is False,s
          assert s['policy']['scoringEffect']=='none',s
          assert s['policy']['rankingEffect']=='none',s
          assert s['policy']['automaticExclusionEffect']=='none',s
          assert s['plateauCandidateCount']>0,s
          assert len(s['gsi']['buildings'])>0,s
          print(json.dumps({
            'anchor':s['gsiAnchor'],
            'osm':{k:v for k,v in s['osmCandidate'].items() if k!='geometry'},
            'top':s['rankedPlateauCandidates'][:5],
            'attrApi':s['plateauAttributeApi']['status'],
            'formalPromotion':s['formalBuildingPolygonsPromoted']
          },ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v10-b46-a2-park-mansion-crosssource-v1
          path: out-b46-a2-park-mansion-crosssource-v1
          if-no-files-found: error
          retention-days: 14
