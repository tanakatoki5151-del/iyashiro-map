name: UNDERLAND A1-GEO raw VRML inspection

on:
  push:
    branches:
      - research/underland-a1-bore-cloud-20260816
    paths:
      - .github/workflows/underland-a1-geo-inspect.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4

      - name: Download and verify official GSJ VRML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/underland-a1-geo-inspect/raw research/underland-a1-geo-inspect/out
          curl --fail --location --retry 3 --retry-all-errors \
            "https://gbank.gsj.jp/urbangeol/data/models_tokyo/Base_Al/surfaces.wrl" \
            --output research/underland-a1-geo-inspect/raw/Base_Al_surfaces.wrl
          curl --fail --location --retry 3 --retry-all-errors \
            "https://gbank.gsj.jp/urbangeol/data/models_tokyo/Base_ToL/surfaces.wrl" \
            --output research/underland-a1-geo-inspect/raw/Base_ToL_surfaces.wrl
          echo "f9aa78a71a3810ea419e40e328179314cee9ca38d6aeb56e573c9be61c18c0b2  research/underland-a1-geo-inspect/raw/Base_Al_surfaces.wrl" > /tmp/expected.sha256
          echo "776c577e33d40ff18b774d0131a98f8db74f85cc678fe586b2f331a68af19b33  research/underland-a1-geo-inspect/raw/Base_ToL_surfaces.wrl" >> /tmp/expected.sha256
          sha256sum --check /tmp/expected.sha256 | tee research/underland-a1-geo-inspect/out/SHA256_CHECK.txt
          wc -c research/underland-a1-geo-inspect/raw/*.wrl | tee research/underland-a1-geo-inspect/out/BYTE_COUNTS.txt

      - name: Extract structural diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re, hashlib

          root = Path('research/underland-a1-geo-inspect')
          out = root / 'out'
          rows = []
          for path in sorted((root / 'raw').glob('*.wrl')):
              data = path.read_bytes()
              text = data.decode('ascii', errors='replace')
              positions = [m.start() for m in re.finditer(r'IndexedFaceSet', text)]
              coord_positions = [m.start() for m in re.finditer(r'Coordinate\s*\{', text)]
              coord_index_positions = [m.start() for m in re.finditer(r'coordIndex\s*\[', text)]
              appearance_positions = [m.start() for m in re.finditer(r'Appearance\s*\{', text)]
              rows.append({
                  'file': path.name,
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'indexedFaceSetCount': len(positions),
                  'indexedFaceSetPositions': positions,
                  'coordinateBlockCount': len(coord_positions),
                  'coordinateBlockPositions': coord_positions,
                  'coordIndexBlockCount': len(coord_index_positions),
                  'coordIndexBlockPositions': coord_index_positions,
                  'appearanceCount': len(appearance_positions),
              })
              for i, pos in enumerate(positions, start=1):
                  start = max(0, pos - 2000)
                  end = min(len(text), pos + 30000)
                  (out / f'{path.stem}_IndexedFaceSet_{i:02d}_context.txt').write_text(
                      text[start:end], encoding='utf-8'
                  )
              for i, pos in enumerate(coord_index_positions, start=1):
                  start = max(0, pos - 1000)
                  end = min(len(text), pos + 12000)
                  (out / f'{path.stem}_coordIndex_{i:02d}_context.txt').write_text(
                      text[start:end], encoding='utf-8'
                  )
          (out / 'VRML_STRUCTURE.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: underland-a1-geo-vrml-inspection-20260816
          path: research/underland-a1-geo-inspect/out/**
          if-no-files-found: error
          retention-days: 30
