name: RYUMYAK GSI vector hydro probe

on:
  push:
    branches: ["research/ryumyak-mega06r-r2-fetch"]
    paths:
      - ".github/workflows/ryumyak-gsi-vector-probe.yml"
      - "iyashiro-map-github-vercel/scripts/ryumyak_gsi_vector_probe.py"
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check mapbox-vector-tile==2.2.0
      - run: python iyashiro-map-github-vercel/scripts/ryumyak_gsi_vector_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: ryumyak-gsi-vector-probe
          path: gsi_probe
          if-no-files-found: error
          retention-days: 7
