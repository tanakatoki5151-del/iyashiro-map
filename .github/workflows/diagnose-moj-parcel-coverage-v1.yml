name: V10 MoJ parcel coverage diagnostic v1

on:
  pull_request:
    paths:
      - research/diagnose_moj_parcel_coverage_v1.py
      - research/acquire_moj_parcel_pilot_v1.py
      - research/inputs/v10-verified-building-polygons-v1.geojson
      - .github/workflows/diagnose-moj-parcel-coverage-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests shapely pyproj

      - name: Diagnose current converted parcel coverage
        run: python research/diagnose_moj_parcel_coverage_v1.py

      - name: Verify fail-closed contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('out-moj-parcel-coverage-diagnostic-v1/SUMMARY.json').read_text(encoding='utf-8'))
          assert len(s['results']) == 2, s
          assert s['policy']['formalParcelPromotion'] is False, s
          assert s['policy']['scoringEffect'] == 'none', s
          assert s['policy']['rankingEffect'] == 'none', s
          assert s['policy']['automaticExclusionEffect'] == 'none', s
          print(json.dumps(s, ensure_ascii=False, indent=2))
          PY

      - name: Upload coverage diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: v10-moj-parcel-coverage-diagnostic-v1
          path: out-moj-parcel-coverage-diagnostic-v1
          if-no-files-found: error
          retention-days: 14
