name: ECOSCAPE Practical V2 PLATEAU Leaf Inventory 48

on:
  push:
    branches:
      - research/ecoscape-moe-qa300-b13
    paths:
      - research/ecoscape/plateau_full_domain/discover_plateau_datasets.py
      - research/ecoscape/plateau_full_domain/inventory_plateau_leaf_tiles.py
      - .github/workflows/ecoscape-practical-v2-plateau-leaf-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecoscape-practical-v2-plateau-leaf-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check requests
      - name: Inventory final PLATEAU content tiles
        run: python research/ecoscape/plateau_full_domain/inventory_plateau_leaf_tiles.py
      - name: Upload leaf inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: ECOSCAPE_PLATEAU_LEAF_INVENTORY_48_M1_V2
          retention-days: 30
          compression-level: 6
          path: output
