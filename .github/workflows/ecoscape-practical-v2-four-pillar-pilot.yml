name: ECOSCAPE Practical V2 Four-Pillar Pilot

on:
  workflow_dispatch:
  push:
    branches: [research/ecoscape-moe-qa300-b13]
    paths:
      - research/ecoscape/four_pillar/build_four_pillar_levelb.py.gz.b64
      - .github/workflows/ecoscape-practical-v2-four-pillar-pilot.yml

permissions:
  contents: read

concurrency:
  group: ecoscape-four-pillar-pilot
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy gdown
      - name: Decode deterministic builder
        run: |
          mkdir -p work input output/run1 output/run2
          base64 --decode research/ecoscape/four_pillar/build_four_pillar_levelb.py.gz.b64 | gzip -dc > work/build_four_pillar_levelb.py
          echo '469fb62335ff3db341d37ae3a4fd945f68dfd89a364aed6353493050460fa35b  work/build_four_pillar_levelb.py' | sha256sum --check
      - name: Download Drive-fixed source inputs
        run: |
          gdown 1BS_fQCVrROTXVSbFS9wesZPZWKge5y4E -O input/B85.zip
          gdown 1BfgNZszd0-OIF32NgCVtbGni-_l-TGe9 -O input/LANDSAT.zip
          gdown 15PvSEGcWN0cLR3_3-WBPRLWLY-JHpBRG -O input/MOE.zip
          gdown 1-SKZ6NcYcDx5eO5Orr5VfsVwPzVkmyPX -O input/PLATEAU_PILOT500.zip
          unzip -t input/B85.zip
          unzip -t input/LANDSAT.zip
          unzip -t input/MOE.zip
          unzip -t input/PLATEAU_PILOT500.zip
          sha256sum input/*.zip > output/DRIVE_INPUT_SHA256SUMS.txt
      - name: First four-pillar run
        run: |
          python work/build_four_pillar_levelb.py \
            --b85 input/B85.zip \
            --landsat input/LANDSAT.zip \
            --moe input/MOE.zip \
            --plateau input/PLATEAU_PILOT500.zip \
            --plateau-member run1/PLATEAU_E3_S01_FACTS.jsonl.gz \
            --out output/run1 \
            --allow-partial
      - name: Exact rerun
        run: |
          python work/build_four_pillar_levelb.py \
            --b85 input/B85.zip \
            --landsat input/LANDSAT.zip \
            --moe input/MOE.zip \
            --plateau input/PLATEAU_PILOT500.zip \
            --plateau-member run1/PLATEAU_E3_S01_FACTS.jsonl.gz \
            --out output/run2 \
            --allow-partial
      - name: Compare deterministic output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('output/run1/ECOSCAPE_FOUR_PILLAR_LEVELB_B99_AUDIT.json').read_text())
          b=json.loads(Path('output/run2/ECOSCAPE_FOUR_PILLAR_LEVELB_B99_AUDIT.json').read_text())
          result={
            'buildId':'ecos-four-pillar-levelb-20260817-b99-pilot500',
            'rows':a['rows'],
            'firstFullSha256':a['fullCsvGzipSha256'],
            'rerunFullSha256':b['fullCsvGzipSha256'],
            'firstCompactSha256':a['compactCsvGzipSha256'],
            'rerunCompactSha256':b['compactCsvGzipSha256'],
            'fullEqual':a['fullCsvGzipSha256']==b['fullCsvGzipSha256'],
            'compactEqual':a['compactCsvGzipSha256']==b['compactCsvGzipSha256'],
            'decisionCounts':a['decisionCounts'],
            'qaPass':a['status']=='PASS' and b['status']=='PASS'
          }
          Path('output/PILOT_RERUN_COMPARISON.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          assert result['rows']==500 and result['fullEqual'] and result['compactEqual'] and result['qaPass']
          PY
      - name: Preserve decoded source
        run: cp work/build_four_pillar_levelb.py output/build_four_pillar_levelb.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ECOSCAPE_FOUR_PILLAR_PILOT500_B99
          retention-days: 30
          compression-level: 6
          path: output
