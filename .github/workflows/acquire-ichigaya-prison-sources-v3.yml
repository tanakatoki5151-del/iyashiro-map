name: Acquire Ichigaya Prison source evidence v3

on:
  workflow_dispatch:
  push:
    branches: [research/ichigaya-prison-boundary-20260811]
    paths:
      - '.github/workflows/acquire-ichigaya-prison-sources-v3.yml'
      - 'research/acquire_ichigaya_prison_sources.py'

permissions:
  contents: write
  actions: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ichigaya-prison-boundary-20260811
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Acquire public source evidence
        continue-on-error: true
        run: python research/acquire_ichigaya_prison_sources.py
      - name: Package output
        if: always()
        run: |
          python - <<'PY'
          import pathlib, zipfile
          root=pathlib.Path('out-ichigaya-prison-sources')
          out=pathlib.Path('ichigaya-prison-source-evidence-v3.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
            if root.exists():
              for p in sorted(root.rglob('*')):
                if p.is_file(): z.write(p,p.relative_to(root.parent))
          PY
          sha256sum ichigaya-prison-source-evidence-v3.zip > ichigaya-prison-source-evidence-v3.zip.sha256
      - name: Publish durable research release asset
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='research-ichigaya-20260811'
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title 'Research source pack: Ichigaya Prison 2026-08-11' --notes 'Research-only source acquisition. No scoring or production boundary changes.' --target research/ichigaya-prison-boundary-20260811
          fi
          gh release upload "$tag" ichigaya-prison-source-evidence-v3.zip ichigaya-prison-source-evidence-v3.zip.sha256 --clobber
      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ichigaya-prison-source-evidence-v3
          path: |
            ichigaya-prison-source-evidence-v3.zip
            ichigaya-prison-source-evidence-v3.zip.sha256
            out-ichigaya-prison-sources/SUMMARY.json
          if-no-files-found: warn
          retention-days: 14
