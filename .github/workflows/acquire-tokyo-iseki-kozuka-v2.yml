name: Acquire Tokyo archaeological-map Kozukappara evidence v2

on:
  workflow_dispatch:
  push:
    branches: [research/mlit-l03b-acquisition-20260811]
    paths:
      - '.github/workflows/acquire-tokyo-iseki-kozuka-v2.yml'
      - 'research/acquire_tokyo_iseki_kozuka_v2.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/acquire-tokyo-iseki-kozuka-v2.yml'
      - 'research/acquire_tokyo_iseki_kozuka_v2.py'

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Capture official public map evidence
        continue-on-error: true
        run: python research/acquire_tokyo_iseki_kozuka_v2.py
      - name: Publish summary
        if: always()
        shell: bash
        run: |
          echo '## Tokyo archaeological map Kozukappara v2' >> "$GITHUB_STEP_SUMMARY"
          if [ -f out-tokyo-iseki-kozuka-v2/SUMMARY.json ]; then
            cat out-tokyo-iseki-kozuka-v2/SUMMARY.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'SUMMARY.json not produced' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tokyo-iseki-kozukappara-probe-v2
          path: out-tokyo-iseki-kozuka-v2
          if-no-files-found: warn
          retention-days: 14
