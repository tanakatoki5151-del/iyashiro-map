name: ECOSCAPE B122 Preview E2E Temporary

on:
  push:
    branches:
      - agent/connect-ecoscape-b120-runtime-v3
    paths:
      - .github/workflows/ecoscape-b122-preview-e2e-temp.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-e2e:
    runs-on: ubuntu-latest
    env:
      PREVIEW_BASE: https://iyashiro-1ordofdeg-tanakatoki5151-dels-projects.vercel.app
      VERCEL_SHARE: BW5fU69SS6l65rYpEEMpUxDcRgtHBqHE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: iyashiro-map-github-vercel/package-lock.json

      - name: Install browser test runtime and capture production dependency audit
        working-directory: iyashiro-map-github-vercel
        shell: bash
        run: |
          npm ci
          mkdir -p preview-artifacts
          npm audit --omit=dev --json > preview-artifacts/npm-audit-production.json || true
          node - <<'NODE'
          const audit = require('./preview-artifacts/npm-audit-production.json');
          const counts = audit.metadata?.vulnerabilities ?? {};
          console.log(JSON.stringify(counts));
          if ((counts.critical ?? 0) > 0) process.exit(1);
          NODE
          npm install --no-save --package-lock=false @playwright/test@1.58.2
          npx playwright install --with-deps chromium

      - name: Write protected-preview E2E
        working-directory: iyashiro-map-github-vercel
        shell: bash
        run: |
          cat > tests/ecoscape-preview-e2e.temp.spec.mjs <<'TEST'
          import { test, expect, devices } from '@playwright/test';
          import { mkdir, writeFile } from 'node:fs/promises';

          const base = process.env.PREVIEW_BASE;
          const share = process.env.VERCEL_SHARE;
          const address = '東京都豊島区目白五丁目8-1';

          test.use({ ...devices['iPhone 13'], browserName: 'chromium' });

          test('ECOSCAPE B122 protected preview API, UI and mobile readback', async ({ page, context }) => {
            const consoleErrors = [];
            const diagnostics = { deployment: base, landing: {}, requests: [], cookies: [], consoleErrors };
            page.on('console', (message) => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            page.on('pageerror', (error) => consoleErrors.push(`pageerror:${error.message}`));

            await mkdir('preview-artifacts', { recursive: true });

            async function browserFetchJson(path) {
              const result = await page.evaluate(async (targetPath) => {
                const response = await fetch(targetPath, {
                  credentials: 'include',
                  cache: 'no-store',
                  redirect: 'follow',
                });
                return {
                  status: response.status,
                  finalUrl: response.url,
                  contentType: response.headers.get('content-type') ?? '',
                  text: await response.text(),
                };
              }, path);
              diagnostics.requests.push({
                path,
                status: result.status,
                finalUrl: result.finalUrl,
                contentType: result.contentType,
                bodyPrefix: result.text.slice(0, 500),
              });
              expect(result.status).toBe(200);
              expect(result.contentType).toContain('application/json');
              return JSON.parse(result.text);
            }

            try {
              const landingResponse = await page.goto(`${base}/?_vercel_share=${share}`, {
                waitUntil: 'networkidle',
              });
              diagnostics.landing = {
                status: landingResponse?.status() ?? null,
                url: page.url(),
                title: await page.title(),
                bodyPrefix: (await page.locator('body').innerText()).slice(0, 500),
              };
              diagnostics.cookies = (await context.cookies(base)).map((cookie) => ({
                name: cookie.name,
                domain: cookie.domain,
                path: cookie.path,
              }));
              expect(new URL(page.url()).hostname).toBe(new URL(base).hostname);

              const coordinate = await browserFetchJson('/api/profile?lat=35.723007&lng=139.694672');
              const ecoscape = coordinate.layers.ecoscape;
              expect(coordinate.spatialContext.cellId).toBe('g130-240');
              expect(ecoscape.availability).toBe('available');
              expect(ecoscape.datasetVersion).toBe('ECOSCAPE_PROPERTY_PROFILE_INDEX_120662_B120');
              expect(ecoscape.scoringEffect).toBe('none');
              expect(ecoscape.metadata.candidateOverride).toBe(false);
              expect(ecoscape.findings[0].metadata.aggregateStateP25).toBe('CAUTION');
              expect(ecoscape.findings[0].metadata.knownPillarsP25).toBe(4);
              expect(ecoscape.findings[0].metadata.favorablePillarsP25).toBe(1);
              expect(ecoscape.findings[0].metadata.cautionPillarsP25).toBe(2);
              expect(coordinate.legacyRuntime.theory.score).toBe(50);
              expect(coordinate.legacyRuntime.modern.score).toBe(75);
              expect(coordinate.legacyRuntime.combined.score).toBe(75);

              const addressProfile = await browserFetchJson(`/api/profile?q=${encodeURIComponent(address)}`);
              expect(addressProfile.spatialContext.cellId).toBe('g130-240');
              expect(addressProfile.layers.ecoscape.availability).toBe('available');

              const unknown = await browserFetchJson('/api/profile?lat=35.74891843334531&lng=139.7270419646649');
              expect(unknown.spatialContext.cellId).toBe('g101-269');
              expect(unknown.layers.ecoscape.availability).toBe('partial');
              expect(unknown.layers.ecoscape.findings[0].metadata.plateauStatus).toBe('UNKNOWN_SOURCE_TILE_404');
              expect(unknown.layers.ecoscape.warnings.join(' ')).toContain('UNKNOWN');

              await page.goto(`${base}/profile?q=${encodeURIComponent(address)}`, { waitUntil: 'networkidle' });
              await expect(page.getByRole('heading', { name: /土地カルテ/ })).toBeVisible();
              await expect(page.getByText('環境・植生', { exact: true })).toBeVisible();
              await expect(page.getByText(/ECOSCAPE環境・住宅候補/)).toBeVisible();
              await expect(page.getByText(/注意条件が優勢/)).toBeVisible();

              const overflow = await page.evaluate(
                () => document.documentElement.scrollWidth - window.innerWidth,
              );
              expect(overflow).toBeLessThanOrEqual(1);
              expect(consoleErrors).toEqual([]);

              diagnostics.result = {
                coordinate: {
                  cellId: coordinate.spatialContext.cellId,
                  availability: ecoscape.availability,
                  datasetVersion: ecoscape.datasetVersion,
                  aggregateStateP25: ecoscape.findings[0].metadata.aggregateStateP25,
                  knownPillarsP25: ecoscape.findings[0].metadata.knownPillarsP25,
                  favorablePillarsP25: ecoscape.findings[0].metadata.favorablePillarsP25,
                  cautionPillarsP25: ecoscape.findings[0].metadata.cautionPillarsP25,
                  scoringEffect: ecoscape.scoringEffect,
                  candidateOverride: ecoscape.metadata.candidateOverride,
                  legacyScores: [
                    coordinate.legacyRuntime.theory.score,
                    coordinate.legacyRuntime.modern.score,
                    coordinate.legacyRuntime.combined.score,
                  ],
                },
                address: { query: address, cellId: addressProfile.spatialContext.cellId },
                explicitUnknown: {
                  cellId: unknown.spatialContext.cellId,
                  availability: unknown.layers.ecoscape.availability,
                  plateauStatus: unknown.layers.ecoscape.findings[0].metadata.plateauStatus,
                },
                mobileOverflowPx: overflow,
              };
            } finally {
              await page.screenshot({
                path: 'preview-artifacts/ecoscape-b122-mobile.png',
                fullPage: true,
              }).catch(() => {});
              await writeFile(
                'preview-artifacts/ecoscape-b122-readback.json',
                JSON.stringify(diagnostics, null, 2) + '\n',
              );
            }
          });
          TEST

      - name: Run protected preview E2E
        id: e2e
        continue-on-error: true
        working-directory: iyashiro-map-github-vercel
        run: npx playwright test tests/ecoscape-preview-e2e.temp.spec.mjs --reporter=line

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecoscape-b122-preview-readback
          path: iyashiro-map-github-vercel/preview-artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Enforce preview E2E result
        if: always()
        shell: bash
        run: |
          test '${{ steps.e2e.outcome }}' = 'success'
