name: Acquire Kozukappara official geometry

on:
  workflow_dispatch:
  push:
    branches: [research/mlit-l03b-acquisition-20260811]
    paths:
      - '.github/workflows/acquire-kozuka-official-geometry.yml'
      - 'research/acquire_kozuka_official_geometry.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/acquire-kozuka-official-geometry.yml'
      - 'research/acquire_kozuka_official_geometry.py'

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geometry dependencies
        run: python -m pip install --disable-pip-version-check requests pyproj shapely
      - name: Acquire public official search/details/WFS geometry
        id: acquire
        continue-on-error: true
        run: python research/acquire_kozuka_official_geometry.py
      - name: Publish summary
        if: always()
        shell: bash
        run: |
          echo '## Kozukappara official archaeological geometry' >> "$GITHUB_STEP_SUMMARY"
          if [ -f out-kozuka-official-geometry/SUMMARY.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('out-kozuka-official-geometry/SUMMARY.json'))
          print(f"- selected IDs: {d.get('selectedIds')}")
          print(f"- normalized features: {d.get('derived',{}).get('normalizedFeatureCount')}")
          print(f"- polygon features: {d.get('derived',{}).get('polygonFeatureCount')}")
          print(f"- status: {d.get('derived',{}).get('status')}")
          print('- scoring effect: none')
          PY
          else
            echo '- SUMMARY.json was not produced' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kozuka-official-geometry
          path: out-kozuka-official-geometry
          if-no-files-found: warn
          retention-days: 14
