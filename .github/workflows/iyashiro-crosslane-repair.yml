name: IYASHIRO crosslane evidence repair

on:
  push:
    branches: [iyashiro-crosslane-evidence-repair-20260822]
    paths:
      - scripts/iyashiro_geocode_and_plateau_fetch.py
      - scripts/iyashiro_ecoscape_temporal_pilot.py
      - scripts/iyashiro_ecoscape_sentinel_repair.py
      - .github/workflows/iyashiro-crosslane-repair.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/iyashiro_geocode_and_plateau_fetch.py
      - scripts/iyashiro_ecoscape_temporal_pilot.py
      - scripts/iyashiro_ecoscape_sentinel_repair.py
      - .github/workflows/iyashiro-crosslane-repair.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geocode-and-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - run: python -m py_compile scripts/iyashiro_geocode_and_plateau_fetch.py
      - run: python scripts/iyashiro_geocode_and_plateau_fetch.py
      - if: always()
        run: |
          find output/crosslane_repair -type f -printf '%p\t%s bytes\n' | sort
          cat output/crosslane_repair/GEOCODE_PLATEAU_FETCH_STATUS.json || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iyashiro-crosslane-geocode-plateau-20260822
          path: output/crosslane_repair/
          if-no-files-found: error
          retention-days: 30

  ecoscape-temporal-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests shapely pyproj rasterio planetary-computer pystac
      - run: python -m py_compile scripts/iyashiro_ecoscape_temporal_pilot.py scripts/iyashiro_ecoscape_sentinel_repair.py
      - run: python scripts/iyashiro_ecoscape_sentinel_repair.py
      - if: always()
        run: |
          find output/ecoscape_temporal_v2 -type f -printf '%p\t%s bytes\n' | sort || true
          cat output/ecoscape_temporal_v2/ECOSCAPE_F17_TEMPORAL_PILOT_REPORT_V1.json || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iyashiro-ecoscape-f17-temporal-pilot-v2-20260822
          path: output/ecoscape_temporal_v2/
          if-no-files-found: error
          retention-days: 30
