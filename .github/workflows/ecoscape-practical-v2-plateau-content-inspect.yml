name: ECOSCAPE Practical V2 PLATEAU Content Format Inspect

on:
  push:
    branches:
      - research/ecoscape-moe-qa300-b13
    paths:
      - research/ecoscape/plateau_full_domain/inspect_plateau_content_formats.py
      - .github/workflows/ecoscape-practical-v2-plateau-content-inspect.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecoscape-practical-v2-plateau-content-inspect
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check requests
      - name: Inspect B3DM and Taito GLB
        run: python research/ecoscape/plateau_full_domain/inspect_plateau_content_formats.py
      - name: Upload content-format evidence
        uses: actions/upload-artifact@v4
        with:
          name: ECOSCAPE_PLATEAU_CONTENT_FORMAT_INSPECT_M1_V2
          retention-days: 30
          compression-level: 0
          path: output
