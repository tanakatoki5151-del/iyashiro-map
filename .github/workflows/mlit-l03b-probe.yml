name: MLIT L03-b probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/mlit-l03b-acquisition-20260811
    paths:
      - '.github/workflows/mlit-l03b-probe.yml'
      - 'research/mlit_l03b_probe.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/mlit-l03b-probe.yml'
      - 'research/mlit_l03b_probe.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Probe official catalogue and download valid ZIPs
        id: probe
        continue-on-error: true
        run: python research/mlit_l03b_probe.py

      - name: Publish compact summary
        if: always()
        shell: bash
        run: |
          echo '## MLIT L03-b acquisition probe' >> "$GITHUB_STEP_SUMMARY"
          if [ -f out/STATUS.txt ]; then
            cat out/STATUS.txt | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- STATUS.txt was not produced' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/SHA256SUMS.txt ]; then
            echo '### Downloaded ZIP checksums' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat out/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlit-l03b-probe
          path: out
          if-no-files-found: warn
          retention-days: 14
