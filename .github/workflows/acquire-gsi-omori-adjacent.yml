name: Acquire GSI Omori adjacent photos

on:
  workflow_dispatch:
  push:
    branches: [research/mlit-l03b-acquisition-20260811]
    paths:
      - '.github/workflows/acquire-gsi-omori-adjacent.yml'
      - 'research/acquire_gsi_omori_adjacent.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/acquire-gsi-omori-adjacent.yml'
      - 'research/acquire_gsi_omori_adjacent.py'

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Discover and acquire adjacent GSI photos
        continue-on-error: true
        run: python research/acquire_gsi_omori_adjacent.py
      - name: Publish summary
        if: always()
        shell: bash
        run: |
          echo '## GSI Omori adjacent photos' >> "$GITHUB_STEP_SUMMARY"
          if [ -f out-gsi-omori-adjacent/SUMMARY.json ]; then
            cat out-gsi-omori-adjacent/SUMMARY.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'SUMMARY.json not produced' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gsi-omori-adjacent-photos
          path: out-gsi-omori-adjacent
          if-no-files-found: warn
          retention-days: 14
