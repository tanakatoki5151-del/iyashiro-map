name: VEIL GSI Jukyo Target Probe

on:
  push:
    branches:
      - project-veil-address-core-v1
    paths:
      - '.github/workflows/veil-gsi-jusho-target-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Acquire official GSI municipal ZIPs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/14101 out/14113 report
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://saigai.gsi.go.jp/jusho/download/data/14101.zip' \
            -o out/14101.zip
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://saigai.gsi.go.jp/jusho/download/data/14113.zip' \
            -o out/14113.zip
          sha256sum out/14101.zip out/14113.zip > report/archive-sha256.txt
          unzip -q out/14101.zip -d out/14101
          unzip -q out/14113.zip -d out/14113
          find out -maxdepth 3 -type f -printf '%p\n' | sort > report/archive-files.txt

      - name: Extract exact target base-number rows without feature promotion
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, pathlib

          targets = [
              {"targetId":"YKH-TSURUMI-OFFICIAL-HIST-05","municipality":"14101","town":"獅子ケ谷三丁目","block":"10","base":"2","role":"FORMAL_ADDRESS_FRONTAGE_POINT"},
              {"targetId":"YKH-TSURUMI-OFFICIAL-HIST-07","municipality":"14101","town":"上の宮二丁目","block":"24","base":"3","role":"FORMAL_ADDRESS_FRONTAGE_POINT"},
              {"targetId":"YKH-TSURUMI-OFFICIAL-HIST-12","municipality":"14101","town":"馬場四丁目","block":"7","base":"5","role":"FORMAL_ADDRESS_FRONTAGE_POINT"},
              {"targetId":"YKH-TSURUMI-OFFICIAL-HIST-15","municipality":"14101","town":"鶴見一丁目","block":"3","base":"5","role":"FORMAL_ADDRESS_FRONTAGE_POINT"},
              {"targetId":"YKH-TSURUMI-OFFICIAL-HIST-17","municipality":"14101","town":"市場東中町","block":"3","base":"18","role":"FORMAL_ADDRESS_FRONTAGE_POINT"},
              {"targetId":"YKH-TSURUMI-OFFICIAL-HIST-19","municipality":"14101","town":"下末吉六丁目","block":"19","base":"31","role":"FORMAL_ADDRESS_FRONTAGE_POINT"},
              {"targetId":"YKH-TSURUMI-OFFICIAL-HIST-25","municipality":"14101","town":"生麦一丁目","block":"11","base":"20","role":"FORMAL_ADDRESS_FRONTAGE_POINT"},
              {"targetId":"YKH-MIDORI-HERITAGE-005","municipality":"14113","town":"鴨居四丁目","block":"13","base":"1","role":"FORMAL_ADDRESS_FRONTAGE_POINT"},
              {"targetId":"YKH-MIDORI-HERITAGE-014","municipality":"14113","town":"長津田六丁目","block":"21","base":"19","role":"ADDRESS_REFERENCE_FRONTAGE_POINT_NEAR_ONLY"},
          ]

          def norm(v):
              s = str(v or '').strip()
              return s.translate(str.maketrans('０１２３４５６７８９－', '0123456789-'))

          all_sources = {}
          for muni in ['14101','14113']:
              csvs = sorted(pathlib.Path('out', muni).rglob('*.csv'))
              if len(csvs) != 1:
                  raise SystemExit(f'Expected exactly one CSV for municipality {muni}, found {len(csvs)}')
              source = csvs[0]
              with source.open('r', encoding='utf-8-sig', newline='') as f:
                  raw_rows = [r for r in csv.reader(f) if r]
              bad_lengths = sorted(set(len(r) for r in raw_rows if len(r) < 9))
              if bad_lengths:
                  raise SystemExit(f'Unexpected short row lengths for {muni}: {bad_lengths}')
              rows = []
              for r in raw_rows:
                  rows.append({
                      'municipalityCode': r[0],
                      'town': r[1],
                      'block': r[2],
                      'baseNumber': r[3],
                      'readableAddressCode': r[4],
                      'reservedOrAuxiliaryField': r[5],
                      'longitude': r[6],
                      'latitude': r[7],
                      'mapInformationLevel': r[8],
                      'rawRow': r,
                  })
              all_sources[muni] = {
                  'csv': str(source),
                  'sourceDateToken': source.stem.split('_')[-1],
                  'rowCount': len(rows),
                  'rows': rows,
              }

          results = []
          for t in targets:
              src = all_sources[t['municipality']]
              matched = [r for r in src['rows'] if
                  norm(r['municipalityCode']) == t['municipality'] and
                  norm(r['town']) == t['town'] and
                  norm(r['block']) == t['block'] and
                  norm(r['baseNumber']) == t['base']
              ]
              results.append({
                  **t,
                  'sourceZipUrl': f"https://saigai.gsi.go.jp/jusho/download/data/{t['municipality']}.zip",
                  'sourceCsv': src['csv'],
                  'sourceDateToken': src['sourceDateToken'],
                  'municipalCsvRowCount': src['rowCount'],
                  'matchCount': len(matched),
                  'matches': matched,
                  'directFeatureGeometryStatus': 'OPEN',
                  'publicEligible': False,
                  'convergenceEligible': False,
                  'scoringEffect': 'none',
              })

          report = {
              'schemaVersion':'VEIL_GSI_JUKYO_TARGET_PROBE_v2',
              'project':'PROJECT_VEIL',
              'sourceAuthority':'国土地理院',
              'sourceClass':'電子国土基本図（地名情報）住居表示住所',
              'csvSchemaObservation':'Current municipal CSV is headerless; positional mapping uses the published/view-table order and preserves rawRow for audit.',
              'coordinateRoleGuard':'GSI base-number points are address/frontage reference points, not individual building, parcel, historical-event, or physical-feature geometry.',
              'targetCount':len(results),
              'exactOneMatchCount':sum(r['matchCount']==1 for r in results),
              'zeroMatchCount':sum(r['matchCount']==0 for r in results),
              'multiMatchCount':sum(r['matchCount']>1 for r in results),
              'results':results,
          }
          pathlib.Path('report/gsi-target-report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({k:report[k] for k in ['targetCount','exactOneMatchCount','zeroMatchCount','multiMatchCount']}, ensure_ascii=False))
          if report['zeroMatchCount'] or report['multiMatchCount']:
              raise SystemExit(2)
          PY

      - name: Upload compact GSI probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veil-gsi-jusho-target-probe
          path: report/
          if-no-files-found: error
          retention-days: 14
