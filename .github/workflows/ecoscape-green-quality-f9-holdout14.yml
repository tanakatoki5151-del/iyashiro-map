name: ECOSCAPE Green Quality F9 NEXUS Holdout 14

on:
  push:
    branches:
      - agent/ecoscape-green-quality-p1
    paths:
      - .github/workflows/ecoscape-green-quality-f9-holdout14.yml
      - research/ecoscape-green-quality/P1_HOLDOUT_14_AREAS_F9.csv
      - research/ecoscape-green-quality/p1_temporal_runner_v3.py
      - research/ecoscape-green-quality/p1_micro_pilot.py
      - research/ecoscape-green-quality/f7_evidence_gate.py
  workflow_dispatch:

permissions:
  contents: read

env:
  HOLDOUT_AREAS: ${{ github.workspace }}/research/ecoscape-green-quality/P1_HOLDOUT_14_AREAS_F9.csv

jobs:
  holdout-shards:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geospatial runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 pandas==2.3.2 rasterio==1.4.3 pystac==1.13.0 pystac-client==0.9.0 planetary-computer==1.0.0
      - name: Run seven-area period-specific shard
        env:
          ECOSCAPE_P1_OUTPUT: ${{ github.workspace }}/research/ecoscape-green-quality/f9-holdout14-shard-${{ matrix.shard }}
          ECOSCAPE_P1_AREAS_CSV: ${{ env.HOLDOUT_AREAS }}
          ECOSCAPE_P1_YEAR_START: '2019'
          ECOSCAPE_P1_YEAR_END: '2026'
          ECOSCAPE_P1_SHARD_INDEX: ${{ matrix.shard }}
          ECOSCAPE_P1_SHARD_COUNT: '2'
          GDAL_HTTP_MAX_RETRY: '5'
          GDAL_HTTP_RETRY_DELAY: '3'
          CPL_VSIL_CURL_CACHE_SIZE: '30000000'
        run: python research/ecoscape-green-quality/p1_temporal_runner_v3.py
      - name: Validate shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(f"research/ecoscape-green-quality/f9-holdout14-shard-{os.environ['SHARD']}/P1_AUDIT_V3.json")
          a = json.loads(p.read_text())
          print(json.dumps(a, indent=2, ensure_ascii=False))
          assert a['pilotAreas'] == 7
          assert a['sentinelSceneRows'] > 0
          assert a['landsatSceneRows'] > 0
          assert a['landsatThermalAssetMissingErrors'] == 0
          assert a['rankingEffect'] == 'none'
          assert a['scoringEffect'] == 'none'
          PY
      - name: Add source contracts and hashes
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          out="research/ecoscape-green-quality/f9-holdout14-shard-${SHARD}"
          cp research/ecoscape-green-quality/P1_HOLDOUT_14_AREAS_F9.csv "$out/"
          cp research/ecoscape-green-quality/p1_temporal_runner_v3.py "$out/"
          cp research/ecoscape-green-quality/p1_micro_pilot.py "$out/"
          sha256sum "$out"/* | sort > "$out/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ecoscape-f9-holdout14-shard-${{ matrix.shard }}
          path: research/ecoscape-green-quality/f9-holdout14-shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 30

  aggregate-holdout:
    needs: holdout-shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 pandas==2.3.2
      - uses: actions/download-artifact@v4
        with:
          pattern: ecoscape-f9-holdout14-shard-*
          path: /tmp/ecoscape-f9-holdout14
      - name: Merge two shards
        run: |
          python - <<'PY'
          from __future__ import annotations
          import csv, json, shutil, statistics
          from pathlib import Path
          root = Path('/tmp/ecoscape-f9-holdout14')
          out = Path('research/ecoscape-green-quality/F9_HOLDOUT14_FINAL')
          if out.exists(): shutil.rmtree(out)
          out.mkdir(parents=True)
          csv_names = [
              'P1_SENTINEL_SCENES_V3.csv',
              'P1_SENTINEL_PERIOD_COMPOSITES_V3.csv',
              'P1_LANDSAT_SUMMER_SCENES_V3.csv',
              'P1_LANDSAT_MULTI_SUMMER_COMPOSITES_V3.csv',
              'P1_COVERAGE_SUMMARY_V3.csv',
          ]
          for name in csv_names:
              inputs = sorted(root.rglob(name))
              if len(inputs) != 2: raise RuntimeError(f'{name}: expected 2 shards, found {len(inputs)}')
              header = None; rows = []
              for path in inputs:
                  with path.open(newline='', encoding='utf-8-sig') as stream:
                      reader = csv.reader(stream); current = next(reader)
                      if header is None: header = current
                      elif current != header: raise RuntimeError(f'header mismatch: {name}')
                      rows.extend(reader)
              with (out / name).open('w', newline='', encoding='utf-8-sig') as stream:
                  writer = csv.writer(stream); writer.writerow(header); writer.writerows(rows)
          errors=[]; audits=[]
          for path in sorted(root.rglob('P1_ERRORS_V3.json')): errors.extend(json.loads(path.read_text()))
          for path in sorted(root.rglob('P1_AUDIT_V3.json')): audits.append(json.loads(path.read_text()))
          (out/'P1_ERRORS_V3.json').write_text(json.dumps(errors, ensure_ascii=False, indent=2)+'\n')
          with (out/'P1_COVERAGE_SUMMARY_V3.csv').open(encoding='utf-8-sig') as stream: coverage=list(csv.DictReader(stream))
          unique={r['pilotId'] for r in coverage}
          if len(coverage)!=14 or len(unique)!=14: raise RuntimeError(f'coverage={len(coverage)} unique={len(unique)}')
          rates=[float(r['fullCoreCoverageRate']) for r in coverage]
          final={
              'buildId':'ecoscape-green-quality-f9-nexus-holdout14-20260819-v1',
              'holdoutAreas':14,
              'shards':2,
              'sentinelSceneRows':sum(int(a['sentinelSceneRows']) for a in audits),
              'landsatSceneRows':sum(int(a['landsatSceneRows']) for a in audits),
              'errorCount':len(errors),
              'landsatThermalAssetMissingErrors':sum(int(a.get('landsatThermalAssetMissingErrors',0)) for a in audits),
              'medianFullCoreCoverageRate':statistics.median(rates),
              'minimumFullCoreCoverageRate':min(rates),
              'coverageRateAtLeast075Count':sum(r>=.75 for r in rates),
              'rankingEffect':'none','scoringEffect':'none','candidateOverride':0,
              'releaseState':'EXPANDED_EXACT_CELL_HOLDOUT_EVIDENCE_ONLY',
          }
          if final['sentinelSceneRows']<=0 or final['landsatSceneRows']<=0 or final['landsatThermalAssetMissingErrors']!=0: raise RuntimeError(final)
          (out/'F9_HOLDOUT14_AUDIT.json').write_text(json.dumps(final, ensure_ascii=False, indent=2)+'\n')
          shutil.copy('research/ecoscape-green-quality/P1_HOLDOUT_14_AREAS_F9.csv', out/'P1_HOLDOUT_14_AREAS_F9.csv')
          print(json.dumps(final, indent=2, ensure_ascii=False))
          PY
      - name: Run descriptive evidence gate
        run: |
          python research/ecoscape-green-quality/f7_evidence_gate.py \
            --sentinel research/ecoscape-green-quality/F9_HOLDOUT14_FINAL/P1_SENTINEL_PERIOD_COMPOSITES_V3.csv \
            --landsat research/ecoscape-green-quality/F9_HOLDOUT14_FINAL/P1_LANDSAT_MULTI_SUMMER_COMPOSITES_V3.csv \
            --coverage research/ecoscape-green-quality/F9_HOLDOUT14_FINAL/P1_COVERAGE_SUMMARY_V3.csv \
            --pilots research/ecoscape-green-quality/P1_HOLDOUT_14_AREAS_F9.csv \
            --output research/ecoscape-green-quality/F9_HOLDOUT14_FINAL/F7_TEMPORAL_ONLY
      - name: Validate safety locks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('research/ecoscape-green-quality/F9_HOLDOUT14_FINAL/F7_TEMPORAL_ONLY/F7_ADOPTION_GATE.json').read_text())
          print(json.dumps(g, indent=2, ensure_ascii=False))
          assert g['pilotAreas']==14
          assert g['gateResults']['temporalCoverage']=='PASS'
          assert g['rankingPromotionAllowed'] is False
          assert g['rankingEffect']=='none' and g['scoringEffect']=='none' and g['candidateOverride']==0
          PY
      - name: Package final artifact
        run: |
          cd research/ecoscape-green-quality/F9_HOLDOUT14_FINAL
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cd ..
          zip -r ECOSCAPE_GREEN_QUALITY_F9_NEXUS_HOLDOUT14_20260819.zip F9_HOLDOUT14_FINAL
      - uses: actions/upload-artifact@v4
        with:
          name: ecoscape-green-quality-f9-nexus-holdout14-20260819
          path: research/ecoscape-green-quality/ECOSCAPE_GREEN_QUALITY_F9_NEXUS_HOLDOUT14_20260819.zip
          if-no-files-found: error
          retention-days: 30
