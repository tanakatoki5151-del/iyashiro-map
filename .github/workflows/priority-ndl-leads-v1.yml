name: Priority NDL leads v1

on:
  push:
    branches:
      - research/mlit-l03b-acquisition-20260811
    paths:
      - 'research/probe_priority_ndl_leads_v1.py'
      - '.github/workflows/priority-ndl-leads-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python research/probe_priority_ndl_leads_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: priority-ndl-leads-v1
          path: out-priority-ndl-leads-v1
          if-no-files-found: warn
          retention-days: 14
