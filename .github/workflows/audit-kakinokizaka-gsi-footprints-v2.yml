name: V10 Kakinokizaka GSI footprint audit v2
on:
  pull_request:
    paths:
      - research/audit_kakinokizaka_gsi_footprints_v2.py
      - research/inputs/kakinokizaka-current-culvert-proxy-v1.geojson
      - .github/workflows/audit-kakinokizaka-gsi-footprints-v2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Score GSI footprints against frozen culvert
        run: python research/audit_kakinokizaka_gsi_footprints_v2.py
      - name: Verify fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('out-kakinokizaka-gsi-footprints-v2/SUMMARY.json').read_text(encoding='utf-8'))
          assert s['sampleCount'] > 0, s
          assert s['policy']['historicalCenterlineVerified'] is False, s
          assert s['policy']['formalHistoricalGeometryPromotion'] is False, s
          assert s['policy']['scoringEffect'] == 'none', s
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v10-kakinokizaka-gsi-footprints-v2
          path: out-kakinokizaka-gsi-footprints-v2
          if-no-files-found: error
          retention-days: 14
