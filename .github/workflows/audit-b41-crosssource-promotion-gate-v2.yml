name: V10 B41 cross-source promotion gate v2

on:
  pull_request:
    paths:
      - research/audit_b41_crosssource_promotion_gate_v2.py
      - .github/workflows/audit-b41-crosssource-promotion-gate-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests lxml pyproj shapely
      - name: Run corrected cross-source promotion gate
        run: python research/audit_b41_crosssource_promotion_gate_v2.py
      - name: Verify contract output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('out-b41-crosssource-promotion-gate-v2/SUMMARY.json').read_text(encoding='utf-8'))
          assert len(s['items']) == 2, s
          assert s['formalPromotionsPerformed'] == 0, s
          assert s['policy']['scoringEffect'] == 'none', s
          for x in s['items']:
            assert x['promotionReady'] == all(x['checks'].values()), x
          print(json.dumps({x['propertyId']:{'ready':x['promotionReady'],'iou':x['crossSource']['iou'],'plateauRank':x['plateau']['physicallyPlausibleRankWithin60m']} for x in s['items']},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v10-b41-crosssource-promotion-gate-v2
          path: out-b41-crosssource-promotion-gate-v2
          if-no-files-found: error
          retention-days: 14
