name: IYASHIRO ECOSCAPE temporal shadow

on:
  push:
    branches: [iyashiro-crosslane-evidence-repair-20260822]
    paths:
      - scripts/iyashiro_ecoscape_temporal.py
      - .github/workflows/iyashiro-ecoscape-temporal.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temporal-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests pystac-client planetary-computer rasterio
      - name: Compile
        run: python -m py_compile scripts/iyashiro_ecoscape_temporal.py
      - name: Run temporal evidence collection
        run: python scripts/iyashiro_ecoscape_temporal.py
      - name: Read back
        if: always()
        run: |
          cat output/ecoscape_temporal/ECOSCAPE_F17_TEMPORAL_RUN_REPORT_V3.json || true
          find output/ecoscape_temporal -type f -printf '%p\t%s bytes\n' | sort || true
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iyashiro-ecoscape-temporal-shadow-20260822
          path: output/ecoscape_temporal/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
