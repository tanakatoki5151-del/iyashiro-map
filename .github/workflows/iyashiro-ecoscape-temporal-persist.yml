name: IYASHIRO ECOSCAPE temporal persist

on:
  push:
    branches: [iyashiro-crosslane-evidence-repair-20260822]
    paths:
      - .github/workflows/iyashiro-ecoscape-temporal-persist.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  temporal-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iyashiro-crosslane-evidence-repair-20260822
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests pystac-client planetary-computer rasterio
      - run: python scripts/iyashiro_ecoscape_temporal.py
      - name: Persist immutable evidence outputs
        run: |
          mkdir -p generated/crosslane-repair/ecoscape-temporal
          cp -a output/ecoscape_temporal/. generated/crosslane-repair/ecoscape-temporal/
          git config user.name "iyashiro-evidence-bot"
          git config user.email "iyashiro-evidence-bot@users.noreply.github.com"
          git add generated/crosslane-repair/ecoscape-temporal
          git diff --cached --quiet || git commit -m "Persist ECOSCAPE temporal shadow evidence"
          git push origin HEAD:iyashiro-crosslane-evidence-repair-20260822
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iyashiro-ecoscape-temporal-persist-20260822
          path: output/ecoscape_temporal/
          if-no-files-found: error
          retention-days: 30
