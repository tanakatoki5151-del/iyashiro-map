name: Priority cells NDL catalog scan v2 fast
on:
  push:
    branches:
      - research/mlit-l03b-acquisition-20260811
    paths:
      - '.github/workflows/priority-cells-ndl-scan-v2-fast.yml'
      - 'research/scan_priority_cells_ndl_v2_fast.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Run compact NDL scan
        run: python research/scan_priority_cells_ndl_v2_fast.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: priority-cells-ndl-v2-fast
          path: out-priority-ndl-v2-fast
          if-no-files-found: warn
          retention-days: 14
