name: ECOSCAPE B122 Security Patch Temporary

on:
  push:
    branches:
      - agent/connect-ecoscape-b120-runtime-v3
    paths:
      - .github/workflows/ecoscape-b122-security-upgrade-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: iyashiro-map-github-vercel/package-lock.json

      - name: Apply non-major Next.js security patch
        working-directory: iyashiro-map-github-vercel
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-exact next@16.3.1
          npm install --save-dev --save-exact eslint-config-next@16.3.1

      - name: Build and regression-test patched application
        working-directory: iyashiro-map-github-vercel
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          mkdir -p .openai
          printf '%s\n' '{"d1":null,"r2":null}' > .openai/hosting.json
          npm test

      - name: Enforce production dependency gate
        working-directory: iyashiro-map-github-vercel
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > /tmp/npm-audit-production-after.json || true
          node - <<'NODE'
          const audit = require('/tmp/npm-audit-production-after.json');
          const counts = audit.metadata?.vulnerabilities ?? {};
          console.log(JSON.stringify(counts));
          if ((counts.critical ?? 0) > 0 || (counts.high ?? 0) > 0) process.exit(1);
          NODE
          git diff --check

      - name: Commit verified package update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iyashiro-map-github-vercel/package.json iyashiro-map-github-vercel/package-lock.json
          if git diff --cached --quiet; then
            echo 'No package changes to commit.'
            exit 0
          fi
          git commit -m 'Patch Next.js runtime dependencies'
          git push origin HEAD:agent/connect-ecoscape-b120-runtime-v3
