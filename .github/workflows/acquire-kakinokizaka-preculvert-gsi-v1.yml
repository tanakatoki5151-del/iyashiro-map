name: V10 Kakinokizaka pre-culvert GSI v1

on:
  pull_request:
    paths:
      - research/acquire_kakinokizaka_preculvert_gsi_v1.py
      - .github/workflows/acquire-kakinokizaka-preculvert-gsi-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Acquire 1945-1971 GSI aerial photographs
        run: python research/acquire_kakinokizaka_preculvert_gsi_v1.py

      - name: Verify fail-closed contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('out-kakinokizaka-preculvert-gsi-v1/SUMMARY.json').read_text(encoding='utf-8'))
          assert s['termsAcceptedInBrowser'] in (True, False), s
          assert s['policy']['historicalCenterlineVerified'] is False, s
          assert s['policy']['formalHistoricalGeometryPromotion'] is False, s
          assert s['policy']['scoringEffect'] == 'none', s
          assert s['downloadedCount'] >= 1, s
          print(json.dumps(s, ensure_ascii=False, indent=2))
          PY

      - name: Upload source evidence
        uses: actions/upload-artifact@v4
        with:
          name: v10-kakinokizaka-preculvert-gsi-v1
          path: out-kakinokizaka-preculvert-gsi-v1
          if-no-files-found: error
          retention-days: 14
