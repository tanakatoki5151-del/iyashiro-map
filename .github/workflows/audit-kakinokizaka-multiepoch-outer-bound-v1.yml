name: V10 Kakinokizaka multi-epoch outer bound v1
on:
  pull_request:
    paths:
      - research/audit_kakinokizaka_multiepoch_outer_bound_v1.py
      - research/inputs/kakinokizaka-current-culvert-proxy-v1.geojson
      - .github/workflows/audit-kakinokizaka-multiepoch-outer-bound-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check shapely pyproj
      - name: Build conservative outer bounds
        run: python research/audit_kakinokizaka_multiepoch_outer_bound_v1.py
      - name: Verify fail-closed and 100m decision guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('out-kakinokizaka-multiepoch-outer-bound-v1/SUMMARY.json').read_text(encoding='utf-8'))
          assert s['decision']['historicalCenterlineVerified'] is False, s
          assert s['decision']['formalHistoricalGeometryPromotion'] is False, s
          assert s['decision']['scoringEffect'] == 'none', s
          assert s['decision']['buffer100mIntersectsAnyTargetCell'] is False, s
          print(json.dumps(s['decision'],ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v10-kakinokizaka-multiepoch-outer-bound-v1
          path: out-kakinokizaka-multiepoch-outer-bound-v1
          if-no-files-found: error
          retention-days: 14
