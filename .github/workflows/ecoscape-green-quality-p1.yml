name: ECOSCAPE Green Quality P1 Micro Pilot

on:
  push:
    branches:
      - agent/ecoscape-green-quality-p1
    paths:
      - .github/workflows/ecoscape-green-quality-p1.yml
      - research/ecoscape-green-quality/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ecoscape-green-quality-p1.yml
      - research/ecoscape-green-quality/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-micro-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install geospatial runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.2.6 \
            pandas==2.3.2 \
            rasterio==1.4.3 \
            pystac==1.13.0 \
            pystac-client==0.9.0 \
            planetary-computer==1.0.0

      - name: Run multi-year seasonal vegetation and multi-summer heat pilot
        env:
          ECOSCAPE_P1_OUTPUT: ${{ github.workspace }}/research/ecoscape-green-quality/output
          GDAL_HTTP_MAX_RETRY: '4'
          GDAL_HTTP_RETRY_DELAY: '2'
          CPL_VSIL_CURL_CACHE_SIZE: '20000000'
        run: |
          python research/ecoscape-green-quality/p1_micro_pilot.py

      - name: Validate non-empty evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research/ecoscape-green-quality/output/P1_AUDIT.json')
          audit = json.loads(p.read_text())
          print(json.dumps(audit, indent=2, ensure_ascii=False))
          assert audit['pilotAreas'] == 6
          assert audit['sentinelSceneRows'] > 0
          assert audit['landsatSceneRows'] > 0
          assert audit['rankingEffect'] == 'none'
          assert audit['scoringEffect'] == 'none'
          PY

      - name: Package evidence
        run: |
          cd research/ecoscape-green-quality
          cp P1_MICRO_PILOT_AREAS.csv output/
          cp p1_micro_pilot.py output/
          sha256sum output/* | sort > output/SHA256SUMS.txt
          zip -r ECOSCAPE_GREEN_QUALITY_P1_MICRO_20260819.zip output

      - uses: actions/upload-artifact@v4
        with:
          name: ecoscape-green-quality-p1-micro-20260819
          path: research/ecoscape-green-quality/ECOSCAPE_GREEN_QUALITY_P1_MICRO_20260819.zip
          if-no-files-found: error
          retention-days: 30
