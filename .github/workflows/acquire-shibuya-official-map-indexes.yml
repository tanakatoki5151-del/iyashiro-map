name: Acquire official Shibuya historical map indexes

on:
  push:
    branches:
      - research/mlit-l03b-acquisition-20260811
    paths:
      - 'research/acquire_shibuya_official_historical_map_indexes.py'
      - '.github/workflows/acquire-shibuya-official-map-indexes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python research/acquire_shibuya_official_historical_map_indexes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shibuya-official-historical-map-indexes
          path: out-shibuya-official-map-indexes
          if-no-files-found: error
          retention-days: 14
