name: V10 UTokyo Komaba I-9 report v1

on:
  pull_request:
    paths:
      - research/acquire_utokyo_komaba9_report_v1.py
      - .github/workflows/acquire-utokyo-komaba9-report-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests pymupdf
      - name: Download official report and render hit pages
        run: python research/acquire_utokyo_komaba9_report_v1.py
      - name: Verify fail-closed contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('out-utokyo-komaba9-report-v1/SUMMARY.json').read_text(encoding='utf-8'))
          assert s['pdfBytes'] > 20_000_000, s['pdfBytes']
          assert s['pageCount'] > 10, s['pageCount']
          assert s['policy']['officialSource'] is True, s
          assert s['policy']['featureGeometryVerified'] is False, s
          assert s['policy']['formalHistoricalGeometryPromotion'] is False, s
          assert s['policy']['scoringEffect'] == 'none', s
          print(json.dumps({
            'pdfBytes':s['pdfBytes'],
            'pageCount':s['pageCount'],
            'textLayerHitPages':s['textLayerHitPages'],
            'termHitCounts':s['termHitCounts'],
            'renderedPages':[x['pageNumber'] for x in s['renderedPages']],
          },ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v10-utokyo-komaba9-report-v1
          path: out-utokyo-komaba9-report-v1
          if-no-files-found: error
          retention-days: 14
