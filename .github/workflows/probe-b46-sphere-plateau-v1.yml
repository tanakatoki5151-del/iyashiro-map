name: V10 B46 SPHERE PLATEAU candidate probe v1

on:
  pull_request:
    paths:
      - research/probe_b46_sphere_plateau_v1.py
      - .github/workflows/probe-b46-sphere-plateau-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests lxml pyproj shapely
      - name: Probe SPHERE via official PLATEAU and GSI
        run: python research/probe_b46_sphere_plateau_v1.py
      - name: Verify fail-closed contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('out-b46-sphere-plateau-v1/SUMMARY.json').read_text(encoding='utf-8'))
          assert s['target']['propertyId']=='BLDG-b1dbdbdf3f3d',s
          assert s['sourceFiles'],s
          assert s['candidateCountWithin90m']>0,s
          assert s['gsiAnchor']['title'],s
          assert s['formalBuildingPolygonsPromoted']==0,s
          assert s['verifiedGeometryAdded']==0,s
          assert s['policy']['scoringEffect']=='none',s
          assert s['policy']['rankingEffect']=='none',s
          assert s['policy']['automaticExclusionEffect']=='none',s
          print(json.dumps({
            'candidateCountWithin90m':s['candidateCountWithin90m'],
            'sameStoreyCandidatesWithin20m':s['sameStoreyCandidatesWithin20m'],
            'exactishCandidatesWithin10mOrContainingGsi':s['exactishCandidatesWithin10mOrContainingGsi'],
            'gsiAnchor':s['gsiAnchor'],
          },ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v10-b46-sphere-plateau-v1
          path: out-b46-sphere-plateau-v1
          if-no-files-found: error
          retention-days: 14
