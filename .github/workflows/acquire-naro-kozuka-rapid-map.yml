name: Acquire NARO Kozukappara rapid-map evidence

on:
  workflow_dispatch:
  push:
    branches: [research/mlit-l03b-acquisition-20260811]
    paths:
      - '.github/workflows/acquire-naro-kozuka-rapid-map.yml'
      - 'research/acquire_naro_kozuka_rapid_map.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/acquire-naro-kozuka-rapid-map.yml'
      - 'research/acquire_naro_kozuka_rapid_map.py'

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Acquire official NARO rapid-map evidence
        continue-on-error: true
        run: python research/acquire_naro_kozuka_rapid_map.py
      - name: Publish summary
        if: always()
        shell: bash
        run: |
          echo '## NARO Kozukappara rapid-map acquisition' >> "$GITHUB_STEP_SUMMARY"
          if [ -f out-naro-kozuka/SUMMARY.json ]; then
            cat out-naro-kozuka/SUMMARY.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'SUMMARY.json not produced' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: naro-kozuka-rapid-map-evidence
          path: out-naro-kozuka
          if-no-files-found: warn
          retention-days: 14
