name: ECOSCAPE F19R2 Full-Domain Temporal Environment Cards

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ecoscape-f19-full-domain-temporal-v2.yml
      - research/ecoscape-environment-cards/**

permissions:
  contents: read

env:
  B114_DRIVE_ID: 1BCV_ejXTy2JIdIAJkecSNcLrscef7lTu
  B114_SHA256: bc179f4c4dfc88b37040765d77074306257d4ff7165b45f68f823750dd866b12
  B120_DRIVE_ID: 1qOqlGpY3iZK-kSuuqr7QaTpWJnslvNaI
  B120_SHA256: add1d47e2b06b12ad8fbc69027a3cb50d18c867b044583576a6d2536822e47c1
  AS_OF_DATE: 2026-08-24
  F18_CODE_DRIVE_ID: 1WhSA_OXavMQLf3W-sc5BXlh0c9d5M7j-
  F18_CODE_SHA256: 6ce559b862b581de70d993c00a804ea3b40c4adc6c929b4db39fe1acd825aba2

jobs:
  temporal-year:
    name: Temporal year ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        year: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download and verify canonical code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/f19-code
          curl --fail --location --retry 6 --retry-delay 4 \
            "https://drive.usercontent.google.com/download?id=${F18_CODE_DRIVE_ID}&export=download&confirm=t" \
            -o /tmp/f19-code/code.zip
          echo "${F18_CODE_SHA256}  /tmp/f19-code/code.zip" | sha256sum -c -
          unzip -q /tmp/f19-code/code.zip -d /tmp/f19-code
          test -f /tmp/f19-code/f18_full_domain_temporal.py
          test -f /tmp/f19-code/f18_build_cards.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.2.6 pandas==2.3.2 pyarrow==21.0.0 \
            rasterio==1.4.3 pyproj==3.7.2 pystac==1.13.0 \
            pystac-client==0.9.0 planetary-computer==1.0.0

      - name: Download and verify B120
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/source /tmp/year
          curl --fail --location --retry 6 --retry-delay 4 \
            "https://drive.usercontent.google.com/download?id=${B120_DRIVE_ID}&export=download&confirm=t" \
            -o /tmp/source/b120.zip
          echo "${B120_SHA256}  /tmp/source/b120.zip" | sha256sum -c -

      - name: Build annual regional composites and sample all cells
        env:
          GDAL_HTTP_MAX_RETRY: "5"
          GDAL_HTTP_RETRY_DELAY: "2"
          CPL_CURL_VERBOSE: "NO"
        run: |
          python /tmp/f19-code/f18_full_domain_temporal.py \
            --year "${{ matrix.year }}" \
            --b120 /tmp/source/b120.zip \
            --output /tmp/year \
            --as-of "${AS_OF_DATE}" \
            --s2-per-tile 3 \
            --landsat-per-pathrow 5

      - name: Validate structure and preserve partial coverage as UNKNOWN
        shell: bash
        run: |
          set -euo pipefail
          YEAR="${{ matrix.year }}" python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd

          year = int(os.environ['YEAR'])
          root = Path('/tmp/year')
          payload = root / f'ECOSCAPE_TEMPORAL_{year}_120662.parquet'
          audit_path = root / f'ECOSCAPE_TEMPORAL_AUDIT_{year}.json'
          frame = pd.read_parquet(payload)
          audit = json.loads(audit_path.read_text())

          assert len(frame) == 120662
          assert frame.canonicalCellId.nunique() == 120662
          assert audit['duplicateCellIds'] == 0
          assert audit['sentinelSelectedItems'] > 0

          usable = int((frame.peak_summer_valid_scene_count > 0).sum())
          rate = usable / 120662
          if usable == 0:
              raise SystemExit(f'No peak-summer usable cells for {year}')
          if rate >= 0.80:
              tier = 'HIGH'
          elif rate >= 0.50:
              tier = 'PARTIAL'
          else:
              tier = 'LOW'

          validation = {
              'year': year,
              'rows': len(frame),
              'uniqueCells': int(frame.canonicalCellId.nunique()),
              'peakSummerUsableCells': usable,
              'peakSummerCoverageRate': rate,
              'annualCoverageTier': tier,
              'missingRule': 'UNKNOWN_NOT_NEGATIVE',
              'sentinelItems': audit['sentinelSelectedItems'],
              'landsatItems': audit['landsatSelectedItems'],
              'errors': len(audit['errors']),
              'structuralPass': True,
          }
          (root / f'ECOSCAPE_TEMPORAL_VALIDATION_{year}.json').write_text(
              json.dumps(validation, ensure_ascii=False, indent=2) + '\n'
          )
          print(json.dumps(validation, ensure_ascii=False, indent=2))
          PY
          cd /tmp/year
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ecoscape-f19r2-temporal-${{ matrix.year }}
          path: /tmp/year
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  merge-cards:
    name: Merge 2019-2026 evidence and build F20 cards
    needs: temporal-year
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download and verify canonical code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/f19-code
          curl --fail --location --retry 6 --retry-delay 4 \
            "https://drive.usercontent.google.com/download?id=${F18_CODE_DRIVE_ID}&export=download&confirm=t" \
            -o /tmp/f19-code/code.zip
          echo "${F18_CODE_SHA256}  /tmp/f19-code/code.zip" | sha256sum -c -
          unzip -q /tmp/f19-code/code.zip -d /tmp/f19-code
          test -f /tmp/f19-code/f18_build_cards.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.2.6 pandas==2.3.2 pyarrow==21.0.0 scipy==1.16.1

      - uses: actions/download-artifact@v4
        with:
          pattern: ecoscape-f19r2-temporal-*
          path: /tmp/temporal
          merge-multiple: true

      - name: Verify eight annual payloads
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          years = range(2019, 2027)
          root = Path('/tmp/temporal')
          for year in years:
              assert (root / f'ECOSCAPE_TEMPORAL_{year}_120662.parquet').exists(), year
              assert (root / f'ECOSCAPE_TEMPORAL_AUDIT_{year}.json').exists(), year
              assert (root / f'ECOSCAPE_TEMPORAL_VALIDATION_{year}.json').exists(), year
          validations = [
              json.loads((root / f'ECOSCAPE_TEMPORAL_VALIDATION_{year}.json').read_text())
              for year in years
          ]
          (root / 'ECOSCAPE_TEMPORAL_VALIDATION_2019_2026.json').write_text(
              json.dumps(validations, ensure_ascii=False, indent=2) + '\n'
          )
          print(json.dumps(validations, ensure_ascii=False, indent=2))
          PY

      - name: Download and verify B114 and B120
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/source /tmp/cards
          curl --fail --location --retry 6 --retry-delay 4 \
            "https://drive.usercontent.google.com/download?id=${B114_DRIVE_ID}&export=download&confirm=t" \
            -o /tmp/source/b114.zip
          curl --fail --location --retry 6 --retry-delay 4 \
            "https://drive.usercontent.google.com/download?id=${B120_DRIVE_ID}&export=download&confirm=t" \
            -o /tmp/source/b120.zip
          echo "${B114_SHA256}  /tmp/source/b114.zip" | sha256sum -c -
          echo "${B120_SHA256}  /tmp/source/b120.zip" | sha256sum -c -

      - name: Build fully temporal environment cards
        run: |
          python /tmp/f19-code/f18_build_cards.py \
            --b114 /tmp/source/b114.zip \
            --b120 /tmp/source/b120.zip \
            --temporal-dir /tmp/temporal \
            --output /tmp/cards

      - name: Package and validate release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          import pandas as pd

          root = Path('/tmp/cards')
          audit_path = root / 'ECOSCAPE_ENVIRONMENT_CARD_AUDIT_F18.json'
          audit = json.loads(audit_path.read_text())
          assert audit['cells'] == 120662
          assert audit['duplicateCellIds'] == 0
          assert audit['rankingEffect'] == 'none'
          assert audit['scoringEffect'] == 'none'
          assert audit['candidateOverride'] == 0

          parquet = next(root.glob('*.parquet'))
          frame = pd.read_parquet(parquet)
          assert len(frame) == 120662
          assert frame.canonicalCellId.nunique() == 120662
          assert frame.summaryHeadlineJa.notna().all()

          sqlite_path = next(root.glob('*.sqlite'))
          connection = sqlite3.connect(sqlite_path)
          count = connection.execute(
              'SELECT COUNT(*) FROM ecoscape_environment_cards'
          ).fetchone()[0]
          connection.close()
          assert count == 120662
          print(json.dumps({
              'rows': len(frame),
              'temporalConfidence': audit.get('temporalConfidence'),
              'medianNarrativeChars': float(frame.summaryDetailedJa.str.len().median()),
          }, ensure_ascii=False, indent=2))
          PY

          cat > /tmp/cards/ECOSCAPE_ENVIRONMENT_CARDS_F20_REPORT.md <<'EOF'
          # ECOSCAPE Environment Cards F20

          F20 patches the 120,662 F18 cards with 2019-2026 full-domain
          vegetation phenology and multi-summer heat evidence.

          Annual partial coverage is retained as UNKNOWN rather than discarded.
          This is a descriptive-card release, not a ranking release.

          Locks: rankingEffect none; scoringEffect none; candidateOverride 0;
          high moisture alone never means wet-heavy; ventilation is potential;
          magnetic high/low is not good/bad.
          EOF
          sed -i 's/^          //' /tmp/cards/ECOSCAPE_ENVIRONMENT_CARDS_F20_REPORT.md

          cd /tmp/cards
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          zip -q -9 -r /tmp/ECOSCAPE_ENVIRONMENT_CARDS_F20_20260825.zip .
          sha256sum /tmp/ECOSCAPE_ENVIRONMENT_CARDS_F20_20260825.zip \
            > /tmp/ECOSCAPE_ENVIRONMENT_CARDS_F20_20260825.zip.sha256

          cd /tmp/temporal
          find . -type f -print0 | sort -z | xargs -0 sha256sum \
            > /tmp/ECOSCAPE_TEMPORAL_F19R2_SHA256SUMS.txt
          zip -q -6 -r /tmp/ECOSCAPE_TEMPORAL_F19R2_2019_2026_20260825.zip .
          sha256sum /tmp/ECOSCAPE_TEMPORAL_F19R2_2019_2026_20260825.zip \
            > /tmp/ECOSCAPE_TEMPORAL_F19R2_2019_2026_20260825.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ecoscape-environment-cards-f20-final
          path: |
            /tmp/ECOSCAPE_ENVIRONMENT_CARDS_F20_20260825.zip
            /tmp/ECOSCAPE_ENVIRONMENT_CARDS_F20_20260825.zip.sha256
            /tmp/ECOSCAPE_TEMPORAL_F19R2_2019_2026_20260825.zip
            /tmp/ECOSCAPE_TEMPORAL_F19R2_2019_2026_20260825.zip.sha256
            /tmp/ECOSCAPE_TEMPORAL_F19R2_SHA256SUMS.txt
            /tmp/temporal/ECOSCAPE_TEMPORAL_VALIDATION_2019_2026.json
            /tmp/cards/ECOSCAPE_ENVIRONMENT_CARD_AUDIT_F18.json
            /tmp/cards/ECOSCAPE_ENVIRONMENT_CARD_SCHEMA_F18.json
            /tmp/cards/ECOSCAPE_ENVIRONMENT_CARD_SAMPLES_F18.json
            /tmp/cards/ECOSCAPE_ENVIRONMENT_CARDS_F20_REPORT.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
