name: Tokyo Digital BookShelf Honjo firemap

on:
  push:
    branches:
      - research/mlit-l03b-acquisition-20260811
    paths:
      - '.github/workflows/tokyo-dbs-honjo-firemap.yml'
      - 'research/probe_tokyo_digital_bookshelf.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Probe public Digital BookShelf
        continue-on-error: true
        run: python research/probe_tokyo_digital_bookshelf.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tokyo-dbs-honjo-firemap
          path: out-firemap-dbs
          if-no-files-found: warn
          retention-days: 14
