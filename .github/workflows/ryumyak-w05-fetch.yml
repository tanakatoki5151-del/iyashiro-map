name: RYUMYAK W05 source acquisition

on:
  push:
    branches: ["research/ryumyak-mega06r-r2-fetch"]
  workflow_dispatch: {}

jobs:
  fetch-w05:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify official W05 archives
        run: python iyashiro-map-github-vercel/scripts/ryumyak_w05_fetch.py
      - name: Upload verified source bundle
        uses: actions/upload-artifact@v4
        with:
          name: ryumyak-w05-tokyo-kanagawa-source
          path: artifacts
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
