name: Assemble ECOSCAPE B120 Runtime

on:
  push:
    branches:
      - agent/connect-ecoscape-b120-runtime
    paths:
      - 'iyashiro-map-github-vercel/.ecoscape-payload/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/connect-ecoscape-b120-runtime

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: iyashiro-map-github-vercel/package-lock.json

      - name: Reassemble the verified payload
        shell: bash
        run: |
          set -euo pipefail
          project='iyashiro-map-github-vercel'
          payload="$project/.ecoscape-payload"
          work="$RUNNER_TEMP/ecoscape-b120-runtime"
          mkdir -p "$work"
          find "$payload" -maxdepth 1 -type f -name 'part-*' -print0 \
            | sort -z \
            | xargs -0 cat > "$work/payload.b64"
          printf '%s  %s\n' \
            '816ba613c235c9276dc97eba7043a5d507e72aff86aca451679d74b634f7b683' \
            "$work/payload.b64" | sha256sum -c -
          base64 --decode "$work/payload.b64" > "$work/payload.tar.gz"
          printf '%s  %s\n' \
            'd36eaceb20321e490451ff98f401ebb7e97d9f01203c5788716f3aad4826ea11' \
            "$work/payload.tar.gz" | sha256sum -c -
          mkdir -p "$work/extracted"
          tar -xzf "$work/payload.tar.gz" -C "$work/extracted"

      - name: Install the runtime, adapter, API and regression tests
        shell: bash
        run: |
          set -euo pipefail
          project='iyashiro-map-github-vercel'
          src="$RUNNER_TEMP/ecoscape-b120-runtime/extracted"
          cp "$src"/ecoscape-runtime-chunk-*.ts "$project/app/lib/location-profile/"
          cp "$src/ecoscape-runtime.ts" "$project/app/lib/location-profile/ecoscape-runtime.ts"
          cp "$src/ecoscape-adapter.ts" "$project/app/lib/location-profile/ecoscape-adapter.ts"
          cp "$src/route.ts" "$project/app/api/profile/route.ts"
          cp "$src/rendered-html.test.mjs" "$project/tests/rendered-html.test.mjs"
          cp "$src/ECOSCAPE_B120_RUNTIME_INTEGRATION_20260817.md" \
            "$project/docs/ECOSCAPE_B120_RUNTIME_INTEGRATION_20260817.md"
          rm -rf "$project/.ecoscape-payload"

      - name: Build and run regression tests
        working-directory: iyashiro-map-github-vercel
        run: |
          npm ci
          npm test

      - name: Commit the verified integration atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Connect ECOSCAPE B120 runtime to LocationProfile'
          git push origin HEAD:agent/connect-ecoscape-b120-runtime
