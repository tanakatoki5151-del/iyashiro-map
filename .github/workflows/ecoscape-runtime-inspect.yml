name: ECOSCAPE Runtime Inspect

on:
  push:
    branches:
      - agent/connect-ecoscape-b120-runtime
    paths:
      - 'iyashiro-map-github-vercel/app/lib/location-profile/ecoscape-runtime-chunk-*.ts'
      - '.github/workflows/ecoscape-runtime-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode staged runtime
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const zlib = require('node:zlib');
          const crypto = require('node:crypto');

          const base = path.join(process.cwd(), 'iyashiro-map-github-vercel', 'app', 'lib', 'location-profile');
          const output = path.join(process.cwd(), 'ecoscape-runtime-inspection');
          fs.mkdirSync(output, { recursive: true });

          const chunkBuffers = [];
          const chunks = [];
          for (let index = 0; index < 4; index += 1) {
            const file = path.join(base, `ecoscape-runtime-chunk-${index}.ts`);
            const source = fs.readFileSync(file, 'utf8');
            const match = source.match(/export default\s+"([A-Za-z0-9+/=]+)";/s);
            if (!match) throw new Error(`Unable to parse ${file}`);
            const bytes = Buffer.from(match[1], 'base64');
            chunkBuffers.push(bytes);
            chunks.push({
              index,
              encodedChars: match[1].length,
              decodedBytes: bytes.length,
              firstHex: bytes.subarray(0, 16).toString('hex'),
              lastHex: bytes.subarray(Math.max(0, bytes.length - 16)).toString('hex'),
            });
          }

          const gzip = Buffer.concat(chunkBuffers);
          fs.writeFileSync(path.join(output, 'ecoscape-runtime.gzip'), gzip);

          let raw = null;
          let strictError = null;
          let partialError = null;
          try {
            raw = zlib.gunzipSync(gzip);
          } catch (error) {
            strictError = error instanceof Error ? `${error.name}: ${error.message}` : String(error);
            try {
              raw = zlib.gunzipSync(gzip, { finishFlush: zlib.constants.Z_SYNC_FLUSH });
            } catch (partial) {
              partialError = partial instanceof Error ? `${partial.name}: ${partial.message}` : String(partial);
            }
          }

          if (raw) fs.writeFileSync(path.join(output, 'ecoscape-runtime.raw'), raw);
          const preview = raw ? raw.subarray(0, Math.min(raw.length, 4096)) : Buffer.alloc(0);
          let parsed = null;
          if (raw) {
            try { parsed = JSON.parse(raw.toString('utf8')); } catch {}
          }

          const metadata = {
            chunks,
            gzipBytes: gzip.length,
            gzipSha256: crypto.createHash('sha256').update(gzip).digest('hex'),
            gzipFirstHex: gzip.subarray(0, 64).toString('hex'),
            gzipLastHex: gzip.subarray(Math.max(0, gzip.length - 64)).toString('hex'),
            strictError,
            partialError,
            partialRecoverySucceeded: raw !== null,
            rawBytes: raw?.length ?? null,
            rawSha256: raw ? crypto.createHash('sha256').update(raw).digest('hex') : null,
            firstBytesHex: preview.subarray(0, 128).toString('hex'),
            firstText: preview.toString('utf8'),
            lastBytesHex: raw ? raw.subarray(Math.max(0, raw.length - 128)).toString('hex') : null,
            lastText: raw ? raw.subarray(Math.max(0, raw.length - 4096)).toString('utf8') : null,
            jsonParsed: parsed !== null,
            jsonTopLevelType: Array.isArray(parsed) ? 'array' : parsed && typeof parsed === 'object' ? 'object' : typeof parsed,
            jsonKeys: parsed && !Array.isArray(parsed) && typeof parsed === 'object' ? Object.keys(parsed).slice(0, 100) : [],
            jsonArrayLength: Array.isArray(parsed) ? parsed.length : null,
            jsonFirstItem: Array.isArray(parsed) ? parsed[0] : null,
          };
          fs.writeFileSync(path.join(output, 'metadata.json'), JSON.stringify(metadata, null, 2));
          console.log(JSON.stringify(metadata, null, 2));
          NODE

      - name: Upload decoded inspection
        uses: actions/upload-artifact@v4
        with:
          name: ecoscape-runtime-inspection
          path: ecoscape-runtime-inspection
          if-no-files-found: error
          retention-days: 7
