name: ECOSCAPE Practical V2 PLATEAU Leaf Sizes 11280

on:
  push:
    branches:
      - research/ecoscape-moe-qa300-b13
    paths:
      - research/ecoscape/plateau_full_domain/discover_plateau_datasets.py
      - research/ecoscape/plateau_full_domain/inventory_plateau_leaf_tiles.py
      - research/ecoscape/plateau_full_domain/measure_plateau_leaf_sizes.py
      - .github/workflows/ecoscape-practical-v2-plateau-leaf-sizes.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecoscape-practical-v2-plateau-leaf-sizes
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check requests
      - name: Measure all final PLATEAU tile sizes
        run: python research/ecoscape/plateau_full_domain/measure_plateau_leaf_sizes.py
      - name: Upload size inventory
        uses: actions/upload-artifact@v4
        with:
          name: ECOSCAPE_PLATEAU_LEAF_SIZES_11280_M1_V2
          retention-days: 30
          compression-level: 6
          path: output
