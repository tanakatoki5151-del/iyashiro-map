name: Tokyo Archives public search form probe

on:
  push:
    branches:
      - research/mlit-l03b-acquisition-20260811
    paths:
      - 'research/probe_tokyo_archives_search.py'
      - '.github/workflows/tokyo-archives-search-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python research/probe_tokyo_archives_search.py
      - run: cat out-tokyo-archives-search-probe/REPORT.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tokyo-archives-search-probe
          path: out-tokyo-archives-search-probe
          if-no-files-found: warn
          retention-days: 14
