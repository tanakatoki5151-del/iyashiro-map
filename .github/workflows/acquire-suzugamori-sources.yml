name: Acquire Suzukamori execution-ground sources

on:
  workflow_dispatch:
  push:
    branches: [research/mlit-l03b-acquisition-20260811]
    paths:
      - '.github/workflows/acquire-suzugamori-sources.yml'
      - 'research/acquire_suzugamori_sources.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/acquire-suzugamori-sources.yml'
      - 'research/acquire_suzugamori_sources.py'

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install acquisition dependencies
        run: |
          python -m pip install --disable-pip-version-check requests pyproj shapely playwright
          python -m playwright install --with-deps chromium
      - name: Acquire official archaeology, georeferenced maps and aerial photos
        continue-on-error: true
        run: python research/acquire_suzugamori_sources.py
      - name: Publish summary
        if: always()
        shell: bash
        run: |
          echo '## Suzukamori source acquisition' >> "$GITHUB_STEP_SUMMARY"
          if [ -f out-suzugamori-sources/SUMMARY.json ]; then
            cat out-suzugamori-sources/SUMMARY.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'SUMMARY.json was not produced' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suzukamori-sources
          path: out-suzugamori-sources
          if-no-files-found: warn
          retention-days: 14
