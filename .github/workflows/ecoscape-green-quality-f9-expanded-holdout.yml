name: ECOSCAPE Green Quality F9 Expanded Exact-Cell Holdout

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ecoscape-green-quality-f9-expanded-holdout.yml
      - research/ecoscape-green-quality/P1_HOLDOUT_EXPANDED_17_AREAS.csv
      - research/ecoscape-green-quality/p1_temporal_runner_v3.py
      - research/ecoscape-green-quality/p1_micro_pilot.py
      - research/ecoscape-green-quality/f7_evidence_gate.py
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPANDED_AREAS: ${{ github.workspace }}/research/ecoscape-green-quality/P1_HOLDOUT_EXPANDED_17_AREAS.csv

jobs:
  expanded-shards:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install geospatial runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.2.6 \
            pandas==2.3.2 \
            rasterio==1.4.3 \
            pystac==1.13.0 \
            pystac-client==0.9.0 \
            planetary-computer==1.0.0

      - name: Run expanded exact-cell temporal shard
        env:
          ECOSCAPE_P1_OUTPUT: ${{ github.workspace }}/research/ecoscape-green-quality/f9-expanded-shard-${{ matrix.shard }}
          ECOSCAPE_P1_AREAS_CSV: ${{ env.EXPANDED_AREAS }}
          ECOSCAPE_P1_YEAR_START: '2019'
          ECOSCAPE_P1_YEAR_END: '2026'
          ECOSCAPE_P1_SHARD_INDEX: ${{ matrix.shard }}
          ECOSCAPE_P1_SHARD_COUNT: '4'
          GDAL_HTTP_MAX_RETRY: '5'
          GDAL_HTTP_RETRY_DELAY: '3'
          CPL_VSIL_CURL_CACHE_SIZE: '30000000'
        run: python research/ecoscape-green-quality/p1_temporal_runner_v3.py

      - name: Validate expanded shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd

          shard = int(os.environ['SHARD'])
          source = pd.read_csv('research/ecoscape-green-quality/P1_HOLDOUT_EXPANDED_17_AREAS.csv').sort_values('pilotId').reset_index(drop=True)
          expected = int((source.index % 4 == shard).sum())
          path = Path(f'research/ecoscape-green-quality/f9-expanded-shard-{shard}/P1_AUDIT_V3.json')
          audit = json.loads(path.read_text())
          print(json.dumps({'expected': expected, 'audit': audit}, indent=2, ensure_ascii=False))
          assert audit['pilotAreas'] == expected
          assert audit['sentinelSceneRows'] > 0
          assert audit['landsatSceneRows'] > 0
          assert audit['landsatThermalAssetMissingErrors'] == 0
          assert audit['medianFullCoreCoverageRate'] >= 0.75
          assert audit['rankingEffect'] == 'none'
          assert audit['scoringEffect'] == 'none'
          PY

      - name: Add source contracts and hashes
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          out="research/ecoscape-green-quality/f9-expanded-shard-${SHARD}"
          cp research/ecoscape-green-quality/P1_HOLDOUT_EXPANDED_17_AREAS.csv "$out/"
          cp research/ecoscape-green-quality/p1_micro_pilot.py "$out/"
          cp research/ecoscape-green-quality/p1_temporal_runner_v3.py "$out/"
          sha256sum "$out"/* | sort > "$out/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ecoscape-f9-expanded-shard-${{ matrix.shard }}
          path: research/ecoscape-green-quality/f9-expanded-shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 30

  aggregate-expanded:
    needs: expanded-shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install numpy==2.2.6 pandas==2.3.2

      - uses: actions/download-artifact@v4
        with:
          pattern: ecoscape-f9-expanded-shard-*
          path: /tmp/ecoscape-f9-expanded

      - name: Merge four expanded shards
        run: |
          python - <<'PY'
          from __future__ import annotations
          import csv, json, shutil, statistics
          from pathlib import Path

          root = Path('/tmp/ecoscape-f9-expanded')
          out = Path('research/ecoscape-green-quality/F9_NEXUS_EXPANDED_FINAL')
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True)
          csv_names = [
              'P1_SENTINEL_SCENES_V3.csv',
              'P1_SENTINEL_PERIOD_COMPOSITES_V3.csv',
              'P1_LANDSAT_SUMMER_SCENES_V3.csv',
              'P1_LANDSAT_MULTI_SUMMER_COMPOSITES_V3.csv',
              'P1_COVERAGE_SUMMARY_V3.csv',
          ]
          for name in csv_names:
              inputs = sorted(root.rglob(name))
              if len(inputs) != 4:
                  raise RuntimeError(f'{name}: expected 4 shards, found {len(inputs)}')
              header = None
              rows = []
              for path in inputs:
                  with path.open(newline='', encoding='utf-8-sig') as stream:
                      reader = csv.reader(stream)
                      current_header = next(reader)
                      if header is None:
                          header = current_header
                      elif current_header != header:
                          raise RuntimeError(f'{name}: header mismatch in {path}')
                      rows.extend(reader)
              with (out / name).open('w', newline='', encoding='utf-8-sig') as stream:
                  writer = csv.writer(stream)
                  writer.writerow(header)
                  writer.writerows(rows)

          errors = []
          audits = []
          for path in sorted(root.rglob('P1_ERRORS_V3.json')):
              errors.extend(json.loads(path.read_text(encoding='utf-8')))
          for path in sorted(root.rglob('P1_AUDIT_V3.json')):
              audits.append(json.loads(path.read_text(encoding='utf-8')))
          (out / 'P1_ERRORS_V3.json').write_text(json.dumps(errors, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          with (out / 'P1_COVERAGE_SUMMARY_V3.csv').open(encoding='utf-8-sig') as stream:
              coverage = list(csv.DictReader(stream))
          unique = {row['pilotId'] for row in coverage}
          if len(coverage) != 17 or len(unique) != 17:
              raise RuntimeError(f'coverage rows={len(coverage)} unique={len(unique)}')
          rates = [float(row['fullCoreCoverageRate']) for row in coverage]
          final_audit = {
              'buildId': 'ecoscape-green-quality-f9-nexus-expanded17-20260819-v1',
              'holdoutAreas': 17,
              'originalHoldoutAreas': 10,
              'expansionRate': 0.70,
              'shards': 4,
              'sentinelSceneRows': sum(int(a['sentinelSceneRows']) for a in audits),
              'landsatSceneRows': sum(int(a['landsatSceneRows']) for a in audits),
              'errorCount': len(errors),
              'landsatThermalAssetMissingErrors': sum(int(a.get('landsatThermalAssetMissingErrors', 0)) for a in audits),
              'medianFullCoreCoverageRate': statistics.median(rates),
              'minimumFullCoreCoverageRate': min(rates),
              'coverageRateAtLeast075Count': sum(rate >= 0.75 for rate in rates),
              'rankingEffect': 'none',
              'scoringEffect': 'none',
              'candidateOverride': 0,
              'releaseState': 'EXPANDED_EXTERNAL_HOLDOUT_EVIDENCE_ONLY',
          }
          if (
              final_audit['sentinelSceneRows'] <= 0
              or final_audit['landsatSceneRows'] <= 0
              or final_audit['landsatThermalAssetMissingErrors'] != 0
              or final_audit['coverageRateAtLeast075Count'] != 17
          ):
              raise RuntimeError(final_audit)
          (out / 'F9_EXPANDED_HOLDOUT_AUDIT.json').write_text(json.dumps(final_audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          shutil.copy('research/ecoscape-green-quality/P1_HOLDOUT_EXPANDED_17_AREAS.csv', out / 'P1_HOLDOUT_EXPANDED_17_AREAS.csv')
          print(json.dumps(final_audit, indent=2, ensure_ascii=False))
          PY

      - name: Run expanded descriptive evidence gate
        run: |
          python research/ecoscape-green-quality/f7_evidence_gate.py \
            --sentinel research/ecoscape-green-quality/F9_NEXUS_EXPANDED_FINAL/P1_SENTINEL_PERIOD_COMPOSITES_V3.csv \
            --landsat research/ecoscape-green-quality/F9_NEXUS_EXPANDED_FINAL/P1_LANDSAT_MULTI_SUMMER_COMPOSITES_V3.csv \
            --coverage research/ecoscape-green-quality/F9_NEXUS_EXPANDED_FINAL/P1_COVERAGE_SUMMARY_V3.csv \
            --pilots research/ecoscape-green-quality/P1_HOLDOUT_EXPANDED_17_AREAS.csv \
            --output research/ecoscape-green-quality/F9_NEXUS_EXPANDED_FINAL/F7_TEMPORAL_ONLY

      - name: Validate safety locks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          gate = json.loads(Path('research/ecoscape-green-quality/F9_NEXUS_EXPANDED_FINAL/F7_TEMPORAL_ONLY/F7_ADOPTION_GATE.json').read_text())
          print(json.dumps(gate, indent=2, ensure_ascii=False))
          assert gate['pilotAreas'] == 17
          assert gate['gateResults']['temporalCoverage'] == 'PASS'
          assert gate['rankingPromotionAllowed'] is False
          assert gate['rankingEffect'] == 'none'
          assert gate['scoringEffect'] == 'none'
          assert gate['candidateOverride'] == 0
          PY

      - name: Add hashes and package expanded holdout
        run: |
          cd research/ecoscape-green-quality/F9_NEXUS_EXPANDED_FINAL
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cd ..
          zip -r ECOSCAPE_GREEN_QUALITY_F9_NEXUS_EXPANDED_17_20260819.zip F9_NEXUS_EXPANDED_FINAL

      - uses: actions/upload-artifact@v4
        with:
          name: ecoscape-green-quality-f9-nexus-expanded-17-20260819
          path: research/ecoscape-green-quality/ECOSCAPE_GREEN_QUALITY_F9_NEXUS_EXPANDED_17_20260819.zip
          if-no-files-found: error
          retention-days: 30
