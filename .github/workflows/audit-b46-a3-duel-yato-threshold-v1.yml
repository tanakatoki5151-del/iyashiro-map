name: V10 B46 A3 Duel Yato threshold audit v1

on:
  pull_request:
    paths:
      - research/probe_b46_a2_park_mansion_crosssource_v1.py
      - research/probe_b46_a3_duel_yato_crosssource_v1.py
      - research/audit_b46_a3_duel_yato_threshold_v1.py
      - research/fixtures/b46_a3_duel_yato_sensitive_subset_v1.json
      - .github/workflows/audit-b46-a3-duel-yato-threshold-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests lxml pyproj shapely mapbox-vector-tile
      - name: Rebuild A3 public-source geometry probe
        run: python research/probe_b46_a3_duel_yato_crosssource_v1.py
      - name: Audit A3 threshold
        run: python research/audit_b46_a3_duel_yato_threshold_v1.py
      - name: Verify autonomous-building closure contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('out-b46-a3-duel-yato-threshold-v1/SUMMARY.json').read_text(encoding='utf-8'))
          assert all(s['gates'].values()),s['gates']
          assert s['thresholdDecision']['classChanged'] is False,s['thresholdDecision']
          assert s['thresholdDecision']['class']=='review',s['thresholdDecision']
          for k in ('plateauShrineM','osmShrineM','gsiShrineM','plateauTempleM','osmTempleM','gsiTempleM'):
              assert s['thresholdDecision'][k] < 500,(k,s['thresholdDecision'])
          assert s['formalBuildingPolygonsPromoted']==0,s
          assert s['policy']['decisionStatus']=='D-DONE',s
          assert s['policy']['autonomousBuildingLane']=='complete_if_this_audit_passes',s
          assert s['policy']['scoringEffect']=='none',s
          assert s['policy']['rankingEffect']=='none',s
          assert s['policy']['automaticExclusionEffect']=='none',s
          print(json.dumps({
            'lead':s['leadPlateau'],
            'threshold':s['thresholdDecision'],
            'formalExistingGate':s['formalExistingGateCheck'],
            'formalPromotion':s['formalBuildingPolygonsPromoted']
          },ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v10-b46-a3-duel-yato-threshold-v1
          path: out-b46-a3-duel-yato-threshold-v1
          if-no-files-found: error
          retention-days: 14
