name: Honjo clothing depot archive probe
on:
  workflow_dispatch:
  push:
    branches: [research/mlit-l03b-acquisition-20260811]
    paths:
      - 'research/honjo_clothing_depot_archive_probe.py'
      - '.github/workflows/honjo-clothing-depot-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python research/honjo_clothing_depot_archive_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: honjo-clothing-depot-archive
          path: out-honjo
          retention-days: 14
