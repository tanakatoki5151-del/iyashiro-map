name: ECOSCAPE Practical V2 PLATEAU Spatial ID Probe

on:
  workflow_dispatch:
  push:
    branches: [research/ecoscape-moe-qa300-b13]
    paths:
      - research/ecoscape/plateau_full_domain/probe_spatialid_attributes.py
      - .github/workflows/ecoscape-practical-v2-plateau-spatialid-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python research/ecoscape/plateau_full_domain/probe_spatialid_attributes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ECOSCAPE_PLATEAU_SPATIALID_PROBE_B95
          retention-days: 30
          path: output
