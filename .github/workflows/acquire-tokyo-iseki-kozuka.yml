name: Acquire Tokyo archaeological-map Kozukappara evidence

on:
  workflow_dispatch:
  push:
    branches: [research/mlit-l03b-acquisition-20260811]
    paths:
      - '.github/workflows/acquire-tokyo-iseki-kozuka.yml'
      - 'research/acquire_tokyo_iseki_kozuka.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/acquire-tokyo-iseki-kozuka.yml'
      - 'research/acquire_tokyo_iseki_kozuka.py'

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GIS acquisition dependencies
        run: python -m pip install --disable-pip-version-check requests pyproj shapely
      - name: Acquire official search, detail and WFS geometry
        continue-on-error: true
        run: python research/acquire_tokyo_iseki_kozuka.py
      - name: Publish summary
        if: always()
        shell: bash
        run: |
          echo '## Tokyo archaeological-map Kozukappara API acquisition' >> "$GITHUB_STEP_SUMMARY"
          if [ -f out-tokyo-iseki-kozuka/SUMMARY.json ]; then
            cat out-tokyo-iseki-kozuka/SUMMARY.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'SUMMARY.json was not produced' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tokyo-iseki-kozukappara-api
          path: out-tokyo-iseki-kozuka
          if-no-files-found: warn
          retention-days: 14
