name: ECOSCAPE Green Quality P1 60-Area Temporal Pilot

on:
  push:
    branches:
      - agent/ecoscape-green-quality-p1
    paths:
      - .github/workflows/ecoscape-green-quality-p1-60.yml
      - research/ecoscape-green-quality/P1_PILOT_60_AREAS_MIN.csv
      - research/ecoscape-green-quality/p1_temporal_runner_v2.py
      - research/ecoscape-green-quality/p1_micro_pilot.py
  workflow_dispatch:

permissions:
  contents: read

env:
  P1_AREAS: ${{ github.workspace }}/research/ecoscape-green-quality/P1_PILOT_60_AREAS_MIN.csv

jobs:
  temporal-shards:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install geospatial runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.2.6 \
            pandas==2.3.2 \
            rasterio==1.4.3 \
            pystac==1.13.0 \
            pystac-client==0.9.0 \
            planetary-computer==1.0.0

      - name: Run deterministic 10-area shard
        env:
          ECOSCAPE_P1_OUTPUT: ${{ github.workspace }}/research/ecoscape-green-quality/output-shard-${{ matrix.shard }}
          ECOSCAPE_P1_AREAS_CSV: ${{ env.P1_AREAS }}
          ECOSCAPE_P1_YEAR_START: '2019'
          ECOSCAPE_P1_YEAR_END: '2026'
          ECOSCAPE_P1_SHARD_INDEX: ${{ matrix.shard }}
          ECOSCAPE_P1_SHARD_COUNT: '6'
          GDAL_HTTP_MAX_RETRY: '5'
          GDAL_HTTP_RETRY_DELAY: '3'
          CPL_VSIL_CURL_CACHE_SIZE: '30000000'
        run: |
          python research/ecoscape-green-quality/p1_temporal_runner_v2.py

      - name: Validate shard contract
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(f"research/ecoscape-green-quality/output-shard-{os.environ['SHARD']}/P1_AUDIT.json")
          audit = json.loads(p.read_text())
          print(json.dumps(audit, indent=2, ensure_ascii=False))
          assert audit['pilotAreas'] == 10
          assert audit['shardCount'] == 6
          assert audit['sentinelSceneRows'] > 0
          assert audit['landsatSceneRows'] > 0
          assert audit['landsatThermalAssetMissingErrors'] == 0
          assert audit['rankingEffect'] == 'none'
          assert audit['scoringEffect'] == 'none'
          PY

      - name: Add source contracts and hashes
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          out="research/ecoscape-green-quality/output-shard-${SHARD}"
          cp research/ecoscape-green-quality/P1_PILOT_60_AREAS_MIN.csv "$out/"
          cp research/ecoscape-green-quality/p1_micro_pilot.py "$out/"
          cp research/ecoscape-green-quality/p1_temporal_runner_v2.py "$out/"
          sha256sum "$out"/* | sort > "$out/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ecoscape-p1-60-shard-${{ matrix.shard }}
          path: research/ecoscape-green-quality/output-shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: temporal-shards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ecoscape-p1-60-shard-*
          path: /tmp/ecoscape-p1-60-shards

      - name: Merge six shards and audit completeness
        run: |
          python - <<'PY'
          from __future__ import annotations
          import csv, hashlib, json, shutil
          from pathlib import Path

          root = Path('/tmp/ecoscape-p1-60-shards')
          out = Path('research/ecoscape-green-quality/P1_60_FINAL')
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True)

          csv_names = [
              'P1_SENTINEL_SCENES.csv',
              'P1_SENTINEL_SEASONAL_COMPOSITES.csv',
              'P1_LANDSAT_SUMMER_SCENES.csv',
              'P1_LANDSAT_MULTI_SUMMER_COMPOSITES.csv',
              'P1_COVERAGE_SUMMARY.csv',
          ]
          for name in csv_names:
              inputs = sorted(root.rglob(name))
              if len(inputs) != 6:
                  raise RuntimeError(f'{name}: expected 6 shards, found {len(inputs)}')
              header = None
              rows = []
              for p in inputs:
                  with p.open(newline='', encoding='utf-8-sig') as f:
                      reader = csv.reader(f)
                      h = next(reader)
                      if header is None:
                          header = h
                      elif h != header:
                          raise RuntimeError(f'{name}: header mismatch in {p}')
                      rows.extend(reader)
              with (out / name).open('w', newline='', encoding='utf-8-sig') as f:
                  writer = csv.writer(f)
                  writer.writerow(header)
                  writer.writerows(rows)

          errors = []
          audits = []
          for p in sorted(root.rglob('P1_ERRORS.json')):
              errors.extend(json.loads(p.read_text(encoding='utf-8')))
          for p in sorted(root.rglob('P1_AUDIT.json')):
              audits.append(json.loads(p.read_text(encoding='utf-8')))
          (out / 'P1_ERRORS.json').write_text(json.dumps(errors, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          with (out / 'P1_COVERAGE_SUMMARY.csv').open(encoding='utf-8-sig') as f:
              coverage = list(csv.DictReader(f))
          unique = {row['pilotId'] for row in coverage}
          if len(coverage) != 60 or len(unique) != 60:
              raise RuntimeError(f'coverage rows={len(coverage)} unique={len(unique)}')

          sentinel_rows = sum(int(a['sentinelSceneRows']) for a in audits)
          landsat_rows = sum(int(a['landsatSceneRows']) for a in audits)
          thermal_missing = sum(int(a.get('landsatThermalAssetMissingErrors', 0)) for a in audits)
          final_audit = {
              'buildId': 'ecoscape-green-quality-p1-60area-20260819-v1',
              'pilotAreas': 60,
              'shards': 6,
              'sentinelSceneRows': sentinel_rows,
              'landsatSceneRows': landsat_rows,
              'errorCount': len(errors),
              'landsatThermalAssetMissingErrors': thermal_missing,
              'rankingEffect': 'none',
              'scoringEffect': 'none',
              'releaseState': 'FEASIBILITY_EVIDENCE_ONLY',
          }
          if sentinel_rows <= 0 or landsat_rows <= 0 or thermal_missing != 0:
              raise RuntimeError(final_audit)
          (out / 'P1_60_AUDIT.json').write_text(json.dumps(final_audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          shutil.copy('research/ecoscape-green-quality/P1_PILOT_60_AREAS_MIN.csv', out / 'P1_PILOT_60_AREAS_MIN.csv')
          shutil.copy('research/ecoscape-green-quality/p1_micro_pilot.py', out / 'p1_micro_pilot.py')
          shutil.copy('research/ecoscape-green-quality/p1_temporal_runner_v2.py', out / 'p1_temporal_runner_v2.py')
          manifest = []
          for p in sorted(out.iterdir()):
              if p.is_file():
                  manifest.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}")
          (out / 'SHA256SUMS.txt').write_text('\n'.join(manifest) + '\n', encoding='utf-8')
          print(json.dumps(final_audit, indent=2, ensure_ascii=False))
          PY

      - name: Package final 60-area evidence
        run: |
          cd research/ecoscape-green-quality
          zip -r ECOSCAPE_GREEN_QUALITY_P1_60AREA_20260819.zip P1_60_FINAL

      - uses: actions/upload-artifact@v4
        with:
          name: ecoscape-green-quality-p1-60area-20260819
          path: research/ecoscape-green-quality/ECOSCAPE_GREEN_QUALITY_P1_60AREA_20260819.zip
          if-no-files-found: error
          retention-days: 30
