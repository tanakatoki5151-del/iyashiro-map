name: ECOSCAPE Green Quality P1 60-Area Period Pilot

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ecoscape-green-quality-p1-60.yml
      - research/ecoscape-green-quality/P1_PILOT_60_AREAS_MIN.csv
      - research/ecoscape-green-quality/p1_temporal_runner_v3.py
      - research/ecoscape-green-quality/p1_micro_pilot.py
      - research/ecoscape-green-quality/f7_evidence_gate.py
  workflow_dispatch:

permissions:
  contents: read

env:
  P1_AREAS: ${{ github.workspace }}/research/ecoscape-green-quality/P1_PILOT_60_AREAS_MIN.csv

jobs:
  temporal-shards:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install geospatial runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.2.6 \
            pandas==2.3.2 \
            rasterio==1.4.3 \
            pystac==1.13.0 \
            pystac-client==0.9.0 \
            planetary-computer==1.0.0

      - name: Run period-specific deterministic 10-area shard
        env:
          ECOSCAPE_P1_OUTPUT: ${{ github.workspace }}/research/ecoscape-green-quality/output-v3-shard-${{ matrix.shard }}
          ECOSCAPE_P1_AREAS_CSV: ${{ env.P1_AREAS }}
          ECOSCAPE_P1_YEAR_START: '2019'
          ECOSCAPE_P1_YEAR_END: '2026'
          ECOSCAPE_P1_SHARD_INDEX: ${{ matrix.shard }}
          ECOSCAPE_P1_SHARD_COUNT: '6'
          GDAL_HTTP_MAX_RETRY: '5'
          GDAL_HTTP_RETRY_DELAY: '3'
          CPL_VSIL_CURL_CACHE_SIZE: '30000000'
        run: |
          python research/ecoscape-green-quality/p1_temporal_runner_v3.py

      - name: Validate shard temporal contract
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(f"research/ecoscape-green-quality/output-v3-shard-{os.environ['SHARD']}/P1_AUDIT_V3.json")
          audit = json.loads(p.read_text())
          print(json.dumps(audit, indent=2, ensure_ascii=False))
          assert audit['pilotAreas'] == 10
          assert audit['sentinelSceneRows'] > 0
          assert audit['landsatSceneRows'] > 0
          assert audit['landsatThermalAssetMissingErrors'] == 0
          assert audit['medianFullCoreCoverageRate'] >= 0.75
          assert audit['rankingEffect'] == 'none'
          assert audit['scoringEffect'] == 'none'
          PY

      - name: Add source contracts and hashes
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          out="research/ecoscape-green-quality/output-v3-shard-${SHARD}"
          cp research/ecoscape-green-quality/P1_PILOT_60_AREAS_MIN.csv "$out/"
          cp research/ecoscape-green-quality/p1_micro_pilot.py "$out/"
          cp research/ecoscape-green-quality/p1_temporal_runner_v3.py "$out/"
          sha256sum "$out"/* | sort > "$out/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ecoscape-p1-60-v3-shard-${{ matrix.shard }}
          path: research/ecoscape-green-quality/output-v3-shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: temporal-shards
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install numpy==2.2.6 pandas==2.3.2

      - uses: actions/download-artifact@v4
        with:
          pattern: ecoscape-p1-60-v3-shard-*
          path: /tmp/ecoscape-p1-60-v3-shards

      - name: Merge six period-specific shards and audit completeness
        run: |
          python - <<'PY'
          from __future__ import annotations
          import csv, hashlib, json, shutil, statistics
          from pathlib import Path

          root = Path('/tmp/ecoscape-p1-60-v3-shards')
          out = Path('research/ecoscape-green-quality/P1_60_PERIOD_FINAL')
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True)

          csv_names = [
              'P1_SENTINEL_SCENES_V3.csv',
              'P1_SENTINEL_PERIOD_COMPOSITES_V3.csv',
              'P1_LANDSAT_SUMMER_SCENES_V3.csv',
              'P1_LANDSAT_MULTI_SUMMER_COMPOSITES_V3.csv',
              'P1_COVERAGE_SUMMARY_V3.csv',
          ]
          for name in csv_names:
              inputs = sorted(root.rglob(name))
              if len(inputs) != 6:
                  raise RuntimeError(f'{name}: expected 6 shards, found {len(inputs)}')
              header = None
              rows = []
              for path in inputs:
                  with path.open(newline='', encoding='utf-8-sig') as stream:
                      reader = csv.reader(stream)
                      current_header = next(reader)
                      if header is None:
                          header = current_header
                      elif current_header != header:
                          raise RuntimeError(f'{name}: header mismatch in {path}')
                      rows.extend(reader)
              with (out / name).open('w', newline='', encoding='utf-8-sig') as stream:
                  writer = csv.writer(stream)
                  writer.writerow(header)
                  writer.writerows(rows)

          errors = []
          audits = []
          for path in sorted(root.rglob('P1_ERRORS_V3.json')):
              errors.extend(json.loads(path.read_text(encoding='utf-8')))
          for path in sorted(root.rglob('P1_AUDIT_V3.json')):
              audits.append(json.loads(path.read_text(encoding='utf-8')))
          (out / 'P1_ERRORS_V3.json').write_text(
              json.dumps(errors, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          with (out / 'P1_COVERAGE_SUMMARY_V3.csv').open(encoding='utf-8-sig') as stream:
              coverage = list(csv.DictReader(stream))
          unique = {row['pilotId'] for row in coverage}
          if len(coverage) != 60 or len(unique) != 60:
              raise RuntimeError(f'coverage rows={len(coverage)} unique={len(unique)}')
          coverage_rates = [float(row['fullCoreCoverageRate']) for row in coverage]

          sentinel_rows = sum(int(a['sentinelSceneRows']) for a in audits)
          landsat_rows = sum(int(a['landsatSceneRows']) for a in audits)
          thermal_missing = sum(int(a.get('landsatThermalAssetMissingErrors', 0)) for a in audits)
          final_audit = {
              'buildId': 'ecoscape-green-quality-p1-60area-period-specific-20260819-v2',
              'pilotAreas': 60,
              'shards': 6,
              'periods': ['SPRING','EARLY_SUMMER','PEAK_SUMMER','AUTUMN_RECOVERY','WINTER_DIAGNOSTIC'],
              'sentinelSceneRows': sentinel_rows,
              'landsatSceneRows': landsat_rows,
              'errorCount': len(errors),
              'landsatThermalAssetMissingErrors': thermal_missing,
              'medianFullCoreCoverageRate': statistics.median(coverage_rates),
              'minimumFullCoreCoverageRate': min(coverage_rates),
              'coverageRateAtLeast075Count': sum(rate >= 0.75 for rate in coverage_rates),
              'rankingEffect': 'none',
              'scoringEffect': 'none',
              'releaseState': 'FEASIBILITY_EVIDENCE_ONLY',
          }
          if (
              sentinel_rows <= 0
              or landsat_rows <= 0
              or thermal_missing != 0
              or final_audit['medianFullCoreCoverageRate'] < 0.75
          ):
              raise RuntimeError(final_audit)
          (out / 'P1_60_PERIOD_AUDIT.json').write_text(
              json.dumps(final_audit, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          shutil.copy('research/ecoscape-green-quality/P1_PILOT_60_AREAS_MIN.csv', out / 'P1_PILOT_60_AREAS_MIN.csv')
          shutil.copy('research/ecoscape-green-quality/p1_micro_pilot.py', out / 'p1_micro_pilot.py')
          shutil.copy('research/ecoscape-green-quality/p1_temporal_runner_v3.py', out / 'p1_temporal_runner_v3.py')
          print(json.dumps(final_audit, indent=2, ensure_ascii=False))
          PY

      - name: Run temporal-only F7 false-positive and threshold gate
        run: |
          python research/ecoscape-green-quality/f7_evidence_gate.py \
            --sentinel research/ecoscape-green-quality/P1_60_PERIOD_FINAL/P1_SENTINEL_PERIOD_COMPOSITES_V3.csv \
            --landsat research/ecoscape-green-quality/P1_60_PERIOD_FINAL/P1_LANDSAT_MULTI_SUMMER_COMPOSITES_V3.csv \
            --coverage research/ecoscape-green-quality/P1_60_PERIOD_FINAL/P1_COVERAGE_SUMMARY_V3.csv \
            --pilots research/ecoscape-green-quality/P1_PILOT_60_AREAS_MIN.csv \
            --output research/ecoscape-green-quality/P1_60_PERIOD_FINAL/F7_TEMPORAL_ONLY

      - name: Validate F7 safety locks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          gate = json.loads(Path('research/ecoscape-green-quality/P1_60_PERIOD_FINAL/F7_TEMPORAL_ONLY/F7_ADOPTION_GATE.json').read_text())
          print(json.dumps(gate, indent=2, ensure_ascii=False))
          assert gate['pilotAreas'] == 60
          assert gate['gateResults']['temporalCoverage'] == 'PASS'
          assert gate['rankingPromotionAllowed'] is False
          assert gate['rankingEffect'] == 'none'
          assert gate['scoringEffect'] == 'none'
          assert gate['candidateOverride'] == 0
          PY

      - name: Add final hashes
        run: |
          cd research/ecoscape-green-quality/P1_60_PERIOD_FINAL
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Package final 60-area period evidence
        run: |
          cd research/ecoscape-green-quality
          zip -r ECOSCAPE_GREEN_QUALITY_P1_60AREA_PERIOD_V2_20260819.zip P1_60_PERIOD_FINAL

      - uses: actions/upload-artifact@v4
        with:
          name: ecoscape-green-quality-p1-60area-period-v2-20260819
          path: research/ecoscape-green-quality/ECOSCAPE_GREEN_QUALITY_P1_60AREA_PERIOD_V2_20260819.zip
          if-no-files-found: error
          retention-days: 30
