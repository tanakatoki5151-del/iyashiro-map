name: V10 B41 PLATEAU candidate address v1

on:
  pull_request:
    paths:
      - research/audit_b41_plateau_candidate_address_v1.py
      - .github/workflows/audit-b41-plateau-candidate-address-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests lxml
      - name: Extract address attributes
        run: python research/audit_b41_plateau_candidate_address_v1.py
      - name: Verify fail-closed contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('out-b41-plateau-candidate-address-v1/SUMMARY.json').read_text(encoding='utf-8'))
          assert len(s['items']) == 4, s
          assert s['policy']['formalPromotion'] == 0, s
          assert s['policy']['scoringEffect'] == 'none', s
          assert all(x['sourceIntegrityMatchesPriorArtifact'] for x in s['items']), s
          print(json.dumps({x['propertyId']:{'candidateAddress':x['flattenedAddressText'],'match':x['expectedAddressTextMatch'],'sourceCity':x['sourceCityName']} for x in s['items']},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v10-b41-plateau-candidate-address-v1
          path: out-b41-plateau-candidate-address-v1
          if-no-files-found: error
          retention-days: 14
