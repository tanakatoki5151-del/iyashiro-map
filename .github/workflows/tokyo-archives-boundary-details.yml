name: Tokyo Archives boundary record details

on:
  push:
    branches:
      - research/mlit-l03b-acquisition-20260811
    paths:
      - 'research/fetch_tokyo_archives_boundary_details.py'
      - '.github/workflows/tokyo-archives-boundary-details.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python research/fetch_tokyo_archives_boundary_details.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tokyo-archives-boundary-details
          path: out-tokyo-archives-boundary-details
          if-no-files-found: warn
          retention-days: 14
